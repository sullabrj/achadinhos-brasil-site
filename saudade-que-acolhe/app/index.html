mpanhar num papel, fazer companhia num dia difícil.","Continuar presente depois das primeiras semanas, quando as visitas diminuem.","Lembrar das datas difíceis, como aniversário e data da partida, e mandar uma mensagem.","Escutar sem tentar resolver nem apressar."],"o_que_evitar":["Dizer 'ele está num lugar melhor' ou 'foi a vontade de Deus', a não ser que a pessoa enlutada fale assim primeiro.","Dizer 'pelo menos...' (pelo menos não sofreu, pelo menos você tem outros filhos).","Dizer 'eu sei exatamente como você se sente'.","Cobrar que a pessoa 'siga em frente' ou 'já deveria estar melhor'.","Comparar com outras perdas.","Sumir por não saber o que dizer."],"frases_que_acolhem":["Sinto muito. Estou aqui.","Não sei o que dizer, mas quero ficar perto.","Posso levar o jantar na quinta?","Lembrei dele hoje e quis te contar.","Hoje deve ser um dia difícil. Estou pensando em você."],"sinais_de_alerta":"Se a pessoa falar em não querer mais viver, parar de cuidar do básico por muito tempo ou usar álcool e remédios para aguentar, incentive a procurar um profissional de saúde. Em caso de risco imediato, ligue 192 (SAMU) ou leve ao pronto-socorro. Para conversar com alguém, o CVV atende pelo 188, gratuito e 24 horas."},"pacotes":[{"id":"pac_despedida","titulo":"Despedida e homenagens","preco":9.9,"venda":"Ideias simples para criar uma despedida ou uma homenagem que tenha a cara de quem partiu, no seu tempo.","secoes":[{"titulo":"Não existe prazo","itens":["Uma homenagem pode acontecer dias, meses ou anos depois da partida.","Se a despedida não foi como você queria, você pode criar outra agora."]},{"titulo":"Homenagens em casa","itens":["Um canto com foto, vela e um objeto que lembre a pessoa.","Um jantar com a comida preferida dela.","Uma tarde ouvindo as músicas que ela gostava."]},{"titulo":"Homenagens com outras pessoas","itens":["Um encontro de lembranças em que cada um traz uma história.","Uma missa, culto ou oração de sétimo dia, mês ou ano, se fizer sentido para a família.","Um álbum coletivo: peça fotos a amigos e parentes."]},{"titulo":"Homenagens que ficam","itens":["Plantar uma árvore ou uma flor que ela gostava.","Doar roupas ou livros para quem precisa, em nome dela.","Fazer uma ação voluntária ligada ao que ela valorizava."]},{"titulo":"Palavras para a homenagem","itens":["Comece com uma lembrança concreta: um jeito, uma frase, um hábito.","Conte o que você aprendeu com essa pessoa.","Termine com o que você quer levar dela para a vida."]},{"titulo":"Prática","itens":["Escreva no diário três ideias de homenagem e escolha uma para fazer este mês."]}]},{"id":"pac_fe","titulo":"Conforto na fé","preco":9.9,"venda":"Reflexões e orações curtas para quem encontra força na fé, respeitando cada caminho espiritual.","secoes":[{"titulo":"Fé e saudade caminham juntas","itens":["Ter fé não impede de chorar. A saudade é sinal de amor.","Dúvidas e perguntas também fazem parte da caminhada espiritual."]},{"titulo":"Uma oração para a manhã","itens":["Que hoje eu tenha força para o que for possível. Que eu sinta paz ao lembrar de quem eu amo. Que eu não carregue sozinho o que é pesado demais."]},{"titulo":"Uma oração para a noite","itens":["Entrego este dia como ele foi. Guardo com carinho a lembrança de quem partiu. Peço descanso para o corpo e para o coração."]},{"titulo":"Pequenos gestos de fé","itens":["Acender uma vela em memória.","Visitar um lugar de oração que essa pessoa frequentava.","Pedir uma oração ou uma celebração na sua comunidade.","Ler um texto sagrado que traga consolo."]},{"titulo":"Quando a fé balança","itens":["Sentir raiva ou distância de Deus pode acontecer no luto. Você pode falar sobre isso com alguém da sua comunidade em quem confia.","Volte devagar, no seu ritmo. A fé também tem dias cinzentos."]},{"titulo":"Prática","itens":["Escreva no diário uma oração com as suas palavras para quem partiu."]}]},{"id":"pac_pet","titulo":"Saudade do meu pet","preco":9.9,"venda":"Para quem perdeu um companheiro de quatro patas, ou imples. Evite 'foi dormir' ou 'viajou': a criança pode ter medo de dormir ou esperar a volta.","Use a palavra 'morreu' e explique que o corpo parou de funcionar e não sente dor.","Deixe a criança perguntar quantas vezes precisar. Repetir faz parte.","Mostre que tudo bem chorar. Chorar junto também ensina.","Mantenha a rotina o máximo possível: escola, horários, brincadeiras."]},{"titulo":"Até 5 anos","itens":["A criança ainda não entende que a morte é para sempre. Explique com calma e repita.","Ela pode voltar a comportamentos de quando era menor, como fazer xixi na cama. Seja paciente.","Frase possível: 'O vovô morreu. O corpo dele parou e ele não vai voltar. Estamos tristes e vamos cuidar de você.'"]},{"titulo":"De 6 a 9 anos","itens":["Começa a entender que a morte é definitiva e pode ter medo de perder outras pessoas.","Pode achar que teve culpa. Diga claramente que não foi culpa dela.","Desenhos, cartas e histórias ajudam a expressar o que sente."]},{"titulo":"De 10 a 12 anos","itens":["Entende bem a morte e pode fazer perguntas mais detalhadas. Responda com honestidade.","Pode esconder a tristeza para proteger os adultos. Diga que ela pode contar com você."]},{"titulo":"Adolescentes","itens":["Podem preferir conversar com amigos. Respeite e continue disponível.","Ofereça participar das decisões, como a despedida.","Atenção a isolamento intenso, queda forte na escola ou uso de álcool."]},{"titulo":"Despedida e lembranças","itens":["A criança pode participar do velório se quiser, sabendo antes o que vai ver.","Uma caixa de memórias com fotos e objetos ajuda a manter o vínculo.","Datas especiais podem ganhar um gesto em família."]},{"titulo":"Quando procurar ajuda","itens":["Se, depois de alguns meses, a criança tiver medo intenso, não conseguir ir à escola, mudar muito o sono ou o apetite, ou falar em querer morrer, procure o pediatra, a escola ou um psicólogo. Em risco imediato, ligue 192 (SAMU)."]}]}]};

// ===== cripto do diário e das cartas =====
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derivar(pin,sal){const k=await crypto.subtle.importKey("raw",enc.encode(pin),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:sal,iterations:150000,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"])}
async function cifrar(txt){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},chave,enc.encode(txt));return b64(iv)+"."+b64(c)}
async function decifrar(s){const[i,c]=s.split(".");const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(i)},chave,ub64(c));return dec.decode(p)}
async function criarSenha(pin){const sal=crypto.getRandomValues(new Uint8Array(16));S.sal=b64(sal);chave=await derivar(pin,sal);S.verif=await cifrar("ok");salvar()}
async function abrirCofre(pin){try{chave=await derivar(pin,ub64(S.sal));await decifrar(S.verif);return true}catch(e){chave=null;return false}}

function db(){return new Promise((ok,er)=>{const r=indexedDB.open("sqa",1);r.onupgradeneeded=()=>r.result.createObjectStore("fotos",{keyPath:"id"});r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)})}
async function fotos(){const d=await db();return new Promise(ok=>{const q=d.transaction("fotos").objectStore("fotos").getAll();q.onsuccess=()=>ok(q.result.sort((a,b)=>b.id-a.id))})}
async function salvarFoto(o){const d=await db();return new Promise(ok=>{const t=d.transaction("fotos","readwrite");t.objectStore("fotos").put(o);t.oncomplete=ok})}
async function apagarFoto(id){const d=await db();return new Promise(ok=>{const t=d.transaction("fotos","readwrite");t.objectStore("fotos").delete(id);t.oncomplete=ok})}
function reduzir(arq){return new Promise(ok=>{const im=new Image();im.onload=()=>{const m=1200,f=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement("canvas");c.width=Math.round(im.width*f);c.height=Math.round(im.height*f);c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.8))};im.src=URL.createObjectURL(arq)})}

function audioDia(d){return AUDIO_DIAS.includes(d)?`<div class="card"><div class="etq">Ouvir a mensagem do dia ${d}</div><audio controls preload="none" style="width:100%" src="audios/dia_${String(d).padStart(3,"0")}.mp3"></audio></div>`:""}
// ===== conteúdo do dia =====
function conteudoDia(n){
 if(n<=30) return DATA.basico.dias[n-1];
 if(!completo()) return null;
 let x=null;for(const d of DATA.completo.dias){if(d.dia<=n)x=d;else break}return x;
}
function extraCaminho(n){const t=S.tipo&&DATA.caminhos.tipos[S.tipo];return t?t.mensagens[String(n)]:null}
function proximaSegundaDom(ano,mes){const d=new Date(ano,mes,1);let c=0;while(true){if(d.getDay()===0){c++;if(c===2)return d}d.setDate(d.getDate()+1)}}
function datasDoAno(ano){
 const L=[];const add=(tipo,dt,nome)=>dt&&L.push({tipo,data:dt,nome});
 const ddmm=(s)=>{if(!s)return null;const p=parseISO(s);return new Date(ano,p.getMonth(),p.getDate())};
 add("aniversario",ddmm(S.aniversario),S.nome);add("partida",ddmm(S.partida),S.nome);
 if(S.comemorativas!==false){add("natal",new Date(ano,11,25));add("ano_novo",new Date(ano,0,1));add("dia_das_maes",proximaSegundaDom(ano,4));add("dia_dos_pais",proximaSegundaDom(ano,7))}
 (S.datas||[]).forEach(d=>add(d.tipo,ddmm(d.data),d.nome));return L;
}
function datasHoje(){
 const h=hojeISO(),am=new Date(h);am.setDate(am.getDate()+1);const R=[];
 for(const a of [h.getFullYear(),h.getFullYear()+1]) for(const d of datasDoAno(a)){
  const info=DATA.datas.datas[d.tipo]||DATA.datas.datas.personalizada;
  if(+d.data===+h)R.push({q:"dia",info,d});else if(+d.data===+am)R.push({q:"vespera",info,d});
 }return R;
}

 if(!completo()&&n>=25)h+=`<div class="card mos"><div class="etq">Para depois do primeiro mês</div><p>Continue acompanhado até completar um ano: mensagens até o dia 365, caminhos para cada tipo de perda e as datas difíceis.</p><a class="btn full" href="#" onclick="comprar('upgrade');return false">Leve o primeiro ano por ${brl(24.90)}</a></div>`;
 return h+historico(n);

 return `<h3>Mensagens anteriores</h3><div class="card"><ul class="lista">${L.reverse().slice(1).map(d=>`<li><span>Dia ${d.dia} · ${esc(d.titulo)}</span><button class="btn sec" onclick="verDia(${d.dia})">Ler</button></li>`).join("")||"<li>As próximas mensagens vão aparecer aqui.</li>"}</ul></div>`}

function baixarICS(){
 const ev=[],ano=new Date().getFullYear();const fx=d=>iso(d).replace(/-/g,"");let i=0;
 const add=(tit,d,rr)=>{const f=new Date(d);f.setDate(f.getDate()+1);ev.push(`BEGIN:VEVENT\r\nUID:sqa${Date.now()}${i++}@saudadequeacolhe\r\nDTSTAMP:${fx(new Date())}T000000Z\r\nDTSTART;VALUE=DATE:${fx(d)}\r\nDTEND;VALUE=DATE:${fx(f)}\r\nRRULE:${rr}\r\nSUMMARY:${tit}\r\nDESCRIPTION:Abra o Saudade que Acolhe para ler a mensagem de hoje.\r\nBEGIN:VALARM\r\nTRIGGER:PT9H\r\nACTION:DISPLAY\r\nDESCRIPTION:${tit}\r\nEND:VALARM\r\nEND:VEVENT`)};
 const fixa=(s,rot)=>{if(!s)return;const p=parseISO(s);const d=new Date(ano,p.getMonth(),p.getDate());const v=new Date(d);v.setDate(v.getDate()-1);add(rot,d,"FREQ=YEARLY");add("Véspera: "+rot,v,"FREQ=YEARLY")};
 fixa(S.aniversario,"Aniversário de "+(S.nome||"quem partiu"));fixa(S.partida,"Data da partida");(S.datas||[]).forEach(x=>fixa(x.data,DATA.datas.datas[x.tipo].rotulo));
 if(S.comemorativas!==false){fixa(ano+"-12-25","Natal");fixa(ano+"-01-01","Ano-Novo");
  add("Dia das Mães",proximaSegundaDom(ano,4),"FREQ=YEARLY;BYMONTH=5;BYDAY=2SU");add("Véspera: Dia das Mães",new Date(proximaSegundaDom(ano,4)-864e5),"FREQ=YEARLY;BYMONTH=5;BYDAY=SA;BYMONTHDAY=7,8,9,10,11,12,13");
  add("Dia dos Pais",proximaSegundaDom(ano,7),"FREQ=YEARLY;BYMONTH=8;BYDAY=2SU");add("Véspera: Dia dos Pais",new Date(proximaSegundaDom(ano,7)-864e5),"FREQ=YEARLY;BYMONTH=8;BYDAY=SA;BYMONTHDAY=7,8,9,10,11,12,13")}
 const t="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Saudade que Acolhe//PT-BR\r\nCALSCALE:GREGORIAN\r\n"+ev.join("\r\n")+"\r\nEND:VCALENDAR\r\n";
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/calendar"}));a.download="datas-saudade-que-acolhe.ics";a.click();
}

function telaLivro(){return `${voltar}<h2>Livro de memórias</h2><p>Junte suas cartas, fotos e páginas do diário num livro em PDF para guardar ou imprimir.</p><div class="card">
 <label><input type="checkbox" id="lc" style="width:auto" checked> Cartas</label><br><label><input type="checkbox" id="lf" style="width:auto" checked> Fotos da caixa de memórias</label><br><label><input type="checkbox" id="ld" style="width:auto"> Páginas do diário</label>
 ${chave?"":`<p class="muted">Para incluir cartas e diário, abra o Diário ou as Cartas com sua senha antes.</p>`}
 <button class="btn full" onclick="gerarLivro()">Gerar livro em PDF</button><p class="muted">Na janela que abrir, escolha "Salvar como PDF".</p></div>`}
async function gerarLivro(){
 const L=$("#livro");let h=`<div class="pg" style="text-align:center;padding-top:40mm"><h1 style="font-size:30px;color:#1F5F6B">${esc(S.nome||"Para quem eu amo")}</h1>${S.aniversario||S.partida?`<p>${S.aniversario?dataBR(S.aniversario):""}${S.aniversario&&S.partida?" · ":""}${S.partida?dataBR(S.partida):""}</p>`:""}<p>Livro de memórias</p></div>`;
 if($("#lc").checked&&chave)for(const c of (await listaCifrada("cartas")).reverse())h+=`<div class="pg"><p style="color:#5C5C5C">${dataBR(c.data)}</p>${c.titulo?`<h2>${esc(c.titulo)}</h2>`:""}<p style="white-space:pre-line">${esc(c.txt)}</p></div>`;
 if($("#lf").checked)for(const f of (await fotos()).reverse())h+=`<div class="pg"><img src="${f.src}"><p style="text-align:center">${esc(f.leg)}</p></div>`;
 if($("#ld").checked&&chave)for(const d of (await listaCifrada("diario")).reverse())h+=`<div class="pg"><p style="color:#5C5C5C">${dataBR(d.data)}</p>${d.perg?`<p><i>${esc(d.perg)}</i></p>`:""}<p style="white-space:pre-line">${esc(d.txt)}</p></div>`;
 L.innerHTML=h;document.title="Livro de memórias - "+(S.nome||"Saudade que Acolhe");setTimeout(()=>{window.print();document.title="Saudade que Acolhe"},300);
}
function telaAjustes(){const tp=Object.entries(DATA.caminhos.tipos).map(([k,v])=>`<option value="${k}" ${S.tipo===k?"selected":""}>${esc(v.rotulo)}</option>`).join("");return `${voltar}<h2>Ajustes</h2><div class="card">
 <label for="an">Nome de quem você está lembrando</label><input id="an" value="${esc(S.nome||"")}">
 <label for="at">Quem essa pessoa era para você</label><select id="at"><option value="">Escolher</option>${tp}</select>
 <label for="ap">Data da partida</label><input id="ap" type="date" value="${S.partida||""}"><label for="aa">Aniversário</label><input id="aa" type="date" value="${S.aniversario||""}">
 <label for="ac">Pessoa de confiança (nome)</label><input id="ac" value="${esc(S.confNome||"")}"><label for="af">Telefone dela</label><input id="af" type="tel" value="${esc(S.confTel||"")}">
 <label for="ai">Início da jornada</label><input id="ai" type="date" value="${S.inicio}">
 <button class="btn full" onclick="salvarAjustes()">Salvar</button></div>
 <div class="card"><p class="muted">Acesso: ${completo()?"O Primeiro Ano":"O Primeiro Mês"} · ${esc(S.email)}</p><button class="btn sec full" onclick="sair()">Sair deste aparelho</button></div>`}
function salvarAjustes(){S.nome=$("#an").value.trim();S.tipo=$("#at").value;S.partida=$("#ap").value;S.aniversario=$("#aa").value;S.confNome=$("#ac").value.trim();S.confTel=$("#af").value.trim();if($("#ai").value&&parseISO($("#ai").value)<=hojeISO())S.inicio=$("#ai").value;salvar();toast("Salvo.");render()}
function sair(){if(sub!=="sair"){sub="sair";return toast("Toque de novo para sair. Seus textos e fotos continuam neste aparelho.")}delete S.acesso;sub=null;chave=null;salvar();render()}
// apoio
let tResp=null;
function abrirApoio(){const A=DATA.apoio,c=A.contatos;const fr=A.frases[Math.floor(Math.random()*A.frases.length)];
 $("#apoioIn").innerHTML=`<p><button class="btn sec" onclick="fecharApoio()">← Voltar</button></p><h2>${esc(A.titulo)}</h2><div class="card bloco"><p style="font-size:20px;margin:0">${esc(fr)}</p></div>
 <h3>Respire por um minuto</h3><div class="card"><div class="etq">Respiração guiada (1 minuto)</div><audio controls preload="none" style="width:100%" src="audios/apoio_respiracao.mp3"></audio></div><p class="muted">Ou acompanhe só o círculo:</p><div class="circulo" id="circ">Toque em começar</div><button class="btn full" id="bR" onclick="respirar()">Começar</button><ul>${A.respiracao.roteiro.map(r=>`<li>${esc(r)}</li>`).join("")}</ul>
 <h3>Falar com alguém</h3>
 ${S.confTel?`<a class="btn full" href="tel:${esc(S.confTel.replace(/[^0-9+]/g,""))}">Ligar para ${esc(S.confNome||"minha pessoa de confiança")}</a>`:`<p class="muted">Cadastre uma pessoa de confiança em Mais › Ajustes.</p>`}
 <a class="btn full" style="background:var(--oliva)" href="tel:188">Ligar 188 · CVV</a><p class="muted">${esc(c.cvv.descricao)}</p>
 <a class="btn full sec" href="tel:192">Ligar 192 · SAMU</a><p class="muted">${esc(c.emergencia)}</p>`;
 $("#apoio").classList.add("on")}
function fecharApoio(){clearInterval(tResp);$("#apoio").classList.remove("on")}
function respirar(){clearInterval(tResp);const c=$("#circ"),b=$("#bR");let t=0;b.textContent="Recomeçar";
 const fases=[["Puxe o ar",4,1.25],["Segure",2,1.25],["Solte devagar",6,.8]];let fi=0,rest=0;
 const passo=()=>{if(t>=60){clearInterval(tResp);c.textContent="Muito bem. Volte aqui quando precisar.";c.style.transform="scale(1)";return}
  if(rest<=0){const f=fases[fi%3];fi++;rest=f[1];c.style.transition="transform "+f[1]+"s ease-in-out";c.style.transform="scale("+f[2]+")";c.dataset.f=f[0]}
  c.textContent=c.dataset.f+" · "+rest;rest--;t++};passo();tResp=setInterval(passo,1000)}
function abrirModal(h){$("#apoioIn").innerHTML=h;$("#apoio").classList.add("on");window.scrollTo(0,0)}
function fecharModal(){fecharApoio()}
document.querySelectorAll("nav.bar button").forEach(b=>b.onclick=()=>{aba=b.dataset.t;sub=null;S.lendo=null;render()});
try{const m={name:"Saudade que Acolhe",short_name:"Saudade",start_url:location.href.split("#")[0],display:"standalone",background_color:"#F5F1EA",theme_color:"#1F5F6B"};const l=document.createElement("link");l.rel="manifest";l.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l)}catch(e){}
render();
</script>
</body>
</html>

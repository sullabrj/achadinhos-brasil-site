<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5F6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saudade que Acolhe">
<meta name="robots" content="noindex">
<title>Saudade que Acolhe</title>
<style>
:root{--bg:#F5F1EA;--card:#FFFFFF;--pet:#1F5F6B;--pet2:#164A53;--oliva:#5E6B33;--mos:#C9952B;--txt:#2B2B2B;--sub:#5C5C5C;--borda:#E2DCD0}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 150px}
header.top{background:var(--pet);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}
header.top .in{max-width:640px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header.top h1{font-size:18px;margin:0;font-weight:600}
header.top small{opacity:.9;font-size:14px}
h2{font-size:22px;margin:22px 0 10px;line-height:1.3}
h3{font-size:18px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:18px;margin:14px 0}
.card.bloco{background:var(--pet);color:#fff;border:0}
.card.oliva{background:var(--oliva);color:#fff;border:0}
.card.mos{background:var(--mos);color:#1E1E1E;border:0}
.etq{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;opacity:.85}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 18px;background:var(--pet);color:#fff;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.sec{background:#fff;color:var(--pet);border:2px solid var(--pet)}
.btn.claro{background:#fff;color:var(--pet)}
.btn.full{display:block;width:100%;margin-top:10px}
input,select,textarea{width:100%;padding:12px;border:1px solid #CFC7B8;border-radius:10px;background:#fff;margin:6px 0 12px;color:var(--txt)}
textarea{min-height:160px;resize:vertical}
label{font-weight:600;font-size:15px}
.muted{color:var(--sub);font-size:15px}
nav.bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borda);z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.bar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.bar button{background:none;border:0;padding:10px 2px;font-size:13px;color:var(--sub);cursor:pointer}
nav.bar button.on{color:var(--pet);font-weight:700}
nav.bar b{display:block;font-size:20px;line-height:1}
#apoioBtn{position:fixed;right:14px;bottom:78px;z-index:7;background:var(--oliva);color:#fff;border:0;border-radius:30px;padding:12px 18px;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.modal{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;display:none}
.modal.on{display:block}
.circulo{width:170px;height:170px;border-radius:50%;background:var(--pet);margin:24px auto;transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;text-align:center;padding:10px}
.lista{list-style:none;padding:0;margin:0}
.lista li{border-bottom:1px solid var(--borda);padding:12px 2px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lista li:last-child{border:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid figure{margin:0;background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.grid figcaption{font-size:14px;padding:6px 8px}
.aviso{font-size:13px;color:var(--sub);margin:28px 0 0;text-align:center}
.pill{display:inline-block;background:#EFE8DA;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600;color:var(--pet2)}
.ok{color:var(--oliva);font-weight:700}
.hide{display:none!important}
.linha{display:flex;gap:10px;flex-wrap:wrap}
.linha>*{flex:1}
.msg{white-space:pre-line}
#livro{display:none}
@media (min-width:900px){.grid{grid-template-columns:repeat(3,1fr)} body{font-size:18px}}
@media print{
 body *{visibility:hidden}
 #livro,#livro *{visibility:visible}
 #livro{display:block;position:absolute;left:0;top:0;width:100%;background:#fff}
 @page{size:A5;margin:14mm}
 .pg{page-break-after:always}
 #livro img{max-width:100%;max-height:120mm;display:block;margin:6mm auto}
}
</style>
</head>
<body>
<header class="top"><div class="in"><h1>Saudade que Acolhe</h1><small id="topInfo"></small></div></header>
<div class="wrap" id="app"></div>
<button id="apoioBtn" class="hide" onclick="abrirApoio()">Quando apertar</button>
<nav class="bar hide" id="nav"><div class="in">
<button data-t="hoje"><b>☀</b>Hoje</button>
<button data-t="diario"><b>✎</b>Diário</button>
<button data-t="cartas"><b>✉</b>Cartas</button>
<button data-t="memorias"><b>▣</b>Memórias</button>
<button data-t="mais"><b>≡</b>Mais</button>
</div></nav>
<div class="modal" id="apoio"><div class="wrap" id="apoioIn"></div></div>
<div id="livro"></div>
<script>
const DATA={"basico":{"nivel":"basico","nome":"O Primeiro Mês","dias":[{"dia":1,"titulo":"Chegar aqui já é um passo","mensagem":"Se você abriu este app, é porque alguém muito importante faz falta. Não existe nada que você precise resolver hoje. Não precisa estar bem, nem forte, nem pronto para nada. Este espaço é seu, para os dias bons e para os dias difíceis. A cada dia, vai chegar aqui uma mensagem curta, uma pequena prática e uma pergunta para o seu diário. Você pode ler tudo, só uma parte ou nada. Hoje, basta saber que você não está sozinho nisso.","pratica":"Respire fundo três vezes, devagar, soltando o ar pela boca.","pergunta_diario":"Qual é o nome de quem você está lembrando hoje?"},{"dia":2,"titulo":"Não existe jeito certo","mensagem":"Cada pessoa sente a perda de um jeito. Tem quem chore muito, tem quem não consiga chorar. Tem quem queira falar o tempo todo e quem prefira silêncio. Tem dias em que a dor parece menor e, de repente, ela volta forte. Nada disso está errado. O luto não segue uma régua nem um calendário. Ele é do tamanho do amor que existia. Hoje, tente não se cobrar por estar sentindo do jeito que está.","pratica":"Escreva uma frase que comece com: Hoje eu estou me sentindo...","pergunta_diario":"O que as pessoas esperam de você que você ainda não consegue dar?"},{"dia":3,"titulo":"O corpo também sente","mensagem":"A saudade não fica só no coração. Ela aparece no cansaço, no sono que não vem ou que não acaba, na falta de fome, no aperto no peito, na dificuldade de prestar atenção. É comum o corpo sentir junto. Por isso, cuidar do básico já é muito: beber água, comer alguma coisa, deitar um pouco. Se algum sintoma físico preocupar você, procure um médico. Hoje, trate seu corpo com a mesma gentileza que você teria com alguém querido.","pratica":"Beba um copo de água agora, com calma.","pergunta_diario":"Como o seu corpo tem reagido nesses dias?"},{"dia":4,"titulo":"A saudade vem em ondas","mensagem":"Muita gente descreve a saudade como ondas. Às vezes o mar está mais calmo, e uma música, um cheiro ou uma frase traz uma onda grande de repente. Isso não significa que você voltou para trás. Significa que o amor continua aí. Quando a onda vier, não precisa lutar contra ela. Deixe passar, como quem espera a água baixar. Ela sempre baixa, mesmo que demore um pouco.","pratica":"Se uma onda vier hoje, use o botão Quando apertar.","pergunta_diario":"O que costuma trazer uma onda de saudade para você?"},{"dia":5,"titulo":"Falar o nome","mensagem":"Muitas vezes as pessoas ao redor evitam falar o nome de quem partiu, com medo de machucar. Mas para quem sente saudade, ouvir e dizer esse nome pode ser um carinho. Dizer o nome em voz alta é lembrar que essa pessoa existiu, foi amada e continua importante. Hoje, se tiver vontade, diga o nome dela em voz alta, conte para alguém uma lembrança ou simplesmente escreva aqui.","pratica":"Diga o nome de quem você ama em voz alta, uma vez.","pergunta_diario":"Qual é a primeira lembrança boa que vem quando você diz esse nome?"},{"dia":6,"titulo":"Uma coisa de cada vez","mensagem":"Nos primeiros tempos, até as tarefas pequenas parecem enormes. Responder mensagens, ir ao mercado, resolver papéis. Está tudo bem fazer menos. Escolha uma coisa só para hoje, a mais necessária, e deixe o resto para depois. O resto pode esperar. Se tiver alguém de confiança por perto, divida alguma tarefa. Aceitar ajuda também é uma forma de cuidar de si.","pratica":"Escolha uma única tarefa para hoje e risque da lista quando terminar.","pergunta_diario":"Que tarefa anda pesando mais para você?"},{"dia":7,"titulo":"Uma semana","mensagem":"Você atravessou mais uma semana. Talvez tenha sido uma das mais difíceis da sua vida, ou talvez os dias tenham se misturado. Não importa como foi: você está aqui. Isso já diz muito. Hoje não é dia de medir se está melhor ou pior. É dia de reconhecer que você continua de pé, do jeito que dá, carregando algo muito pesado.","pratica":"Escreva três coisas que você conseguiu fazer nesta semana, por menores que sejam.","pergunta_diario":"O que mais ajudou você nesses dias?"},{"dia":8,"titulo":"Raiva e culpa também aparecem","mensagem":"Junto com a tristeza, podem aparecer sentimentos que assustam: raiva da situação, de alguém, até de quem partiu. Culpa pelo que foi dito ou não foi dito, pelo que poderia ter sido diferente. Esses sentimentos são muito comuns no luto e não fazem de você uma pessoa ruim. Eles fazem parte de tentar entender uma perda que não faz sentido. Dê espaço para eles aqui, sem julgamento.","pratica":"Escreva no diário, sem reler: o que me deixa com raiva ou culpa é...","pergunta_diario":"Se um amigo sentisse essa mesma culpa, o que você diria a ele?"},{"dia":9,"titulo":"Pedir e aceitar ajuda","mensagem":"Muitas pessoas querem ajudar e não sabem como. Muitas vezes elas dizem: se precisar, me chama. E a gente não chama. Hoje, pense em algo concreto que alguém poderia fazer por você: uma comida, uma carona, ficar junto em silêncio, cuidar de um papel. Pedir ajuda específica facilita para os dois lados. Você não precisa carregar tudo sozinho.","pratica":"Mande uma mensagem pedindo uma coisa específica a alguém de confiança.","pergunta_diario":"Quem são as pessoas com quem você pode contar agora?"},{"dia":10,"titulo":"Lembranças que aquecem","mensagem":"Hoje o convite é lembrar de um momento bom. Uma risada, uma viagem, um almoço de domingo, uma mania engraçada, um jeito de falar. Lembrar pode doer e aquecer ao mesmo tempo. As memórias são uma forma de manter perto quem não está mais aqui. Ninguém pode tirar de você o que vocês viveram juntos.","pratica":"Guarde uma foto ou uma lembrança na sua caixa de memórias.","pergunta_diario":"Conte uma lembrança boa com o máximo de detalhes que conseguir."},{"dia":11,"titulo":"O que ficou sem dizer","mensagem":"Quase sempre fica alguma coisa sem dizer: um obrigado, um desculpa, um eu te amo, uma notícia que você queria contar. Escrever uma carta para quem partiu pode ajudar a colocar isso para fora. Não precisa ser bonita nem certa. Ninguém vai ler, só você. Escreva como se estivesse conversando, do seu jeito.","pratica":"Escreva uma carta curta começando com: Eu queria te contar que...","pergunta_diario":"O que você gostaria de dizer se tivesse mais cinco minutos?"},{"dia":12,"titulo":"Os lugares vazios","mensagem":"A cadeira na mesa, o lado da cama, o número no celular, o horário em que vocês conversavam. A ausência aparece nos detalhes do dia. Esses momentos costumam doer mais porque são inesperados. Se ajudar, você pode criar um pequeno gesto para esses momentos: acender uma vela, dizer um bom dia, tocar uma música. Não existe certo ou errado nisso.","pratica":"Escolha um gesto simples para fazer quando sentir a ausência no dia a dia.","pergunta_diario":"Em que momento do dia a ausência pesa mais?"},{"dia":13,"titulo":"Dormir e acordar","mensagem":"A noite costuma ser difícil. Quando o barulho do dia acaba, os pensamentos aparecem. E o acordar também pode doer, quando a memória da perda volta. Tente criar uma rotina calma antes de dormir: luz mais baixa, celular longe por alguns minutos, uma respiração lenta. Se a dificuldade para dormir continuar por muito tempo, vale conversar com um profissional de saúde.","pratica":"Antes de dormir hoje, faça a respiração do botão Quando apertar.","pergunta_diario":"Como têm sido as suas noites?"},{"dia":14,"titulo":"Quando os outros voltam à rotina","mensagem":"Duas semanas depois, muita gente ao redor volta para a vida normal. As visitas diminuem, as mensagens param. E pode parecer que só você continua sentindo. Isso não quer dizer que as pessoas esqueceram. Quer dizer que elas não sabem como continuar perto. Se sentir falta de companhia, é válido procurar alguém e dizer: ainda está difícil.","pratica":"Escreva para alguém próximo contando como você está de verdade.","pergunta_diario":"Do que você sente falta nas pessoas ao seu redor?"},{"dia":15,"titulo":"Chorar ou não chorar","mensagem":"Tem gente que chora todos os dias. Tem gente que não consegue chorar e se pergunta se está fazendo algo errado. As duas coisas são normais. O choro alivia para alguns, e outros sentem de outro jeito: em silêncio, no trabalho, cuidando de alguém. Não existe prova de amor medida em lágrimas. O que você sente é verdadeiro do jeito que sai.","pratica":"Se tiver vontade de chorar hoje, permita-se. Se não tiver, tudo bem também.","pergunta_diario":"Como a saudade costuma aparecer em você?"},{"dia":16,"titulo":"Objetos e cheiros","mensagem":"Roupas, perfume, uma caneca, um bilhete, uma ferramenta. Os objetos de quem partiu carregam muita coisa. Não existe prazo para decidir o que fazer com eles. Algumas pessoas guardam tudo por um tempo, outras doam aos poucos, outras transformam em lembrança. Não decida nada com pressa ou sob pressão de ninguém.","pratica":"Escolha um objeto que você quer guardar para sempre e fotografe para a caixa de memórias.","pergunta_diario":"Que objeto mais lembra essa pessoa?"},{"dia":17,"titulo":"Dias bons sem culpa","mensagem":"Em algum momento, um dia vai ser um pouco mais leve. Você vai rir de algo, sentir vontade de sair, comer com prazer. E pode vir uma culpa: como posso estar bem? Sentir alegria não apaga o amor nem a saudade. Muitas vezes, quem partiu gostaria de ver você sorrindo de novo. Dias bons e dias difíceis podem conviver.","pratica":"Quando algo trouxer um pouco de leveza hoje, apenas perceba, sem se cobrar.","pergunta_diario":"O que trouxe um pouco de leveza para você nos últimos dias?"},{"dia":18,"titulo":"Um pouco de ar","mensagem":"Sair de casa, mesmo que por pouco tempo, pode ajudar. Uma volta no quarteirão, sentar no quintal, olhar o céu, pegar sol pela manhã. Não é para esquecer a dor. É para dar ao corpo e à cabeça um pouco de espaço. Se for possível, vá até um lugar de que vocês gostavam, ou a um lugar novo e tranquilo.","pratica":"Faça uma caminhada curta ou fique dez minutos ao ar livre.","pergunta_diario":"Que lugar traz paz para você?"},{"dia":19,"titulo":"Comer e cuidar","mensagem":"No luto, é comum esquecer de comer ou comer sem perceber. Cuidar da alimentação não é frescura, é um jeito de sustentar o corpo num período pesado. Não precisa ser nada elaborado: uma fruta, um prato simples, uma sopa. Se puder, coma com alguém. Comer junto também é companhia.","pratica":"Faça uma refeição hoje com calma, sentado, sem pressa.","pergunta_diario":"Tem alguma comida que lembra essa pessoa?"},{"dia":20,"titulo":"O que ficou em você","mensagem":"Quem a gente ama deixa marcas: um jeito de rir, um conselho, uma receita, um valor, uma forma de enxergar a vida. Essas marcas continuam em você. Hoje, pense no que essa pessoa ensinou, mesmo sem querer ensinar. Isso é uma forma de ela continuar presente na sua vida.","pratica":"Escreva uma coisa que essa pessoa te ensinou.","pergunta_diario":"Que parte dela você enxerga em si mesmo?"},{"dia":21,"titulo":"Três semanas","mensagem":"Já são três semanas. Talvez você perceba pequenas mudanças, talvez não. Algumas pessoas sentem a dor mais forte agora, quando o choque inicial passa e a realidade pesa. Isso também é comum. Não existe um caminho em linha reta. Continue no seu tempo, um dia de cada vez.","pratica":"Releia o que você escreveu no primeiro dia. Só observe.","pergunta_diario":"O que mudou e o que continua igual desde o começo?"},{"dia":22,"titulo":"Cada luto é único","mensagem":"Às vezes ouvimos frases como: fulano perdeu alguém e já está bem. Ou nos comparamos com outras pessoas da família que parecem sentir menos ou mais. Cada relação foi única, então cada luto também é. Comparar só aumenta a cobrança. O seu caminho é seu.","pratica":"Quando ouvir uma comparação, respire e lembre: o meu tempo é meu.","pergunta_diario":"Que frase você já ouviu que doeu?"},{"dia":23,"titulo":"Perguntas sem resposta","mensagem":"Por que aconteceu? E se eu tivesse feito diferente? Por que agora? Muitas perguntas do luto não têm resposta. Ficar preso nelas pode cansar muito. Às vezes, o possível é aceitar que não vamos entender tudo e, mesmo assim, continuar cuidando de nós e da memória de quem partiu.","pratica":"Escreva as perguntas que mais aparecem e, ao lado, escreva: talvez eu não saiba, e tudo bem.","pergunta_diario":"Qual pergunta mais volta na sua cabeça?"},{"dia":24,"titulo":"Conversar faz diferença","mensagem":"Guardar tudo para si pode pesar. Conversar com alguém que escuta sem julgar pode aliviar: um amigo, alguém da família, um grupo de apoio, um líder da sua comunidade, um profissional. Não é sinal de fraqueza. É uma forma de não carregar sozinho. Se em algum momento precisar conversar com alguém agora, o CVV atende pelo 188, gratuito, 24 horas.","pratica":"Marque uma conversa com alguém de confiança nesta semana.","pergunta_diario":"Com quem você se sente à vontade para falar sobre essa pessoa?"},{"dia":25,"titulo":"Gratidão sem forçar","mensagem":"Gratidão não é fingir que está tudo bem. É, quando der, notar o que foi bom: o tempo que vocês tiveram juntos, as pessoas que estão ao seu lado, um gesto de carinho recebido. Não precisa ser hoje se não fizer sentido. Mas, se fizer, pode trazer um pouco de calor no meio da dor.","pratica":"Escreva uma coisa pela qual você é grato na história de vocês.","pergunta_diario":"O que de bom essa pessoa trouxe para a sua vida?"},{"dia":26,"titulo":"Um gesto em homenagem","mensagem":"Algumas pessoas sentem conforto em fazer algo em homenagem a quem partiu: plantar uma árvore, cozinhar a receita favorita, ouvir a música preferida, ajudar alguém em nome dela, visitar um lugar especial. É uma forma de transformar a saudade em gesto.","pratica":"Escolha um gesto simples de homenagem para fazer nesta semana.","pergunta_diario":"Que gesto teria a cara dessa pessoa?"},{"dia":27,"titulo":"As datas que vão chegar","mensagem":"Aniversários, datas comemorativas, a data da partida. Elas costumam ser difíceis, e a véspera às vezes pesa mais que o próprio dia. Planejar ajuda: decidir com quem estar, o que fazer, se quer um momento de lembrança. Você pode cadastrar essas datas no app para receber uma mensagem preparada para cada uma.","pratica":"Cadastre no app uma data importante que está chegando.","pergunta_diario":"Qual data você mais teme e como gostaria de passar por ela?"},{"dia":28,"titulo":"Quando buscar mais ajuda","mensagem":"Sentir muita tristeza é parte do luto. Mas alguns sinais pedem ajuda profissional: não conseguir cuidar do básico por muito tempo, como comer, tomar banho ou dormir; pensar que não vale a pena continuar; usar álcool ou remédios para aguentar; sentir que a vida perdeu todo o sentido. Se algo assim acontecer, procure um profissional de saúde. Se precisar falar com alguém agora, ligue 188, o CVV, gratuito e 24 horas.","pratica":"Salve o número 188 nos contatos do seu celular.","pergunta_diario":"Quem você chamaria se precisasse de ajuda num dia muito difícil?"},{"dia":29,"titulo":"O amor continua","mensagem":"Perder alguém não apaga o vínculo. Muitas pessoas continuam conversando com quem partiu, sentindo a presença em sinais, carregando essa pessoa nas decisões. Isso não é negar a perda. É uma forma de o amor continuar existindo de outro jeito. Você pode manter essa ligação do jeito que fizer sentido para você.","pratica":"Escreva uma mensagem para essa pessoa como se ela fosse ler hoje.","pergunta_diario":"Como você sente que essa pessoa continua presente?"},{"dia":30,"titulo":"Um mês","mensagem":"Você completou um mês nesta jornada. Não é uma linha de chegada. O luto não termina num prazo. Mas é um bom momento para olhar para trás e ver o caminho que você fez: os dias difíceis que você atravessou, as lembranças que guardou, as palavras que escreveu. Daqui para frente, os dias vão continuar tendo altos e baixos. E você não precisa atravessá-los sozinho.","pratica":"Releia algumas entradas do seu diário e escreva o que você percebe.","pergunta_diario":"O que você quer levar com você daqui para frente?"}]},"completo":{"nivel":"completo","nome":"O Primeiro Ano","observacao":"Inclui também os dias 1 a 30 do Básico (jornada_basico.json)","dias":[{"dia":31,"titulo":"O segundo mês","mensagem":"Muita gente percebe que o segundo mês pode ser mais difícil que o primeiro. O choque passa, as pessoas voltam à rotina e a ausência fica mais clara. Se for assim com você, saiba que é comum. A partir de agora, este espaço vai continuar com você, dia a dia, até completar o primeiro ano.","pratica":"Escolha um horário fixo do dia para abrir o app.","pergunta_diario":"Como você chega ao segundo mês?"},{"dia":32,"titulo":"Rotina nova","mensagem":"A vida mudou e a rotina também. Horários, tarefas, conversas que não acontecem mais. Montar uma rotina nova, simples, pode dar um pouco de chão: acordar num horário, fazer uma caminhada, ligar para alguém em certo dia. Não é esquecer, é criar estrutura para atravessar.","pratica":"Escreva três coisas fixas que você quer ter na sua semana.","pergunta_diario":"O que na sua rotina mudou mais?"},{"dia":33,"titulo":"Responder à pergunta 'tudo bem?'","mensagem":"Essa pergunta pode ficar difícil. Você não precisa contar tudo para todo mundo. Pode ter uma resposta curta para quem é distante, como 'estou indo, um dia de cada vez', e uma resposta verdadeira para quem é próximo. Proteger sua energia também é cuidado.","pratica":"Pense na sua resposta curta e deixe pronta.","pergunta_diario":"Com quem você consegue ser totalmente sincero?"},{"dia":34,"titulo":"O silêncio da casa","mensagem":"O silêncio pode pesar onde antes havia voz, passos, barulho de panela, televisão ligada. Algumas pessoas colocam música, rádio ou um áudio para companhia. Outras preferem o silêncio. Teste o que deixa o ambiente mais acolhedor para você.","pratica":"Escolha uma música calma para tocar em casa hoje.","pergunta_diario":"Que sons você sente falta?"},{"dia":35,"titulo":"Lembrar sem doer tanto","mensagem":"Com o tempo, algumas lembranças começam a trazer sorriso junto com a saudade. Não acontece de uma vez, nem para todas as lembranças. Quando acontecer, deixe ficar. É o amor encontrando um jeito novo de morar em você.","pratica":"Conte para alguém uma história engraçada dessa pessoa.","pergunta_diario":"Que lembrança já traz um sorriso?"},{"dia":36,"titulo":"A mente cansada","mensagem":"Esquecer coisas, perder a concentração, ler a mesma linha várias vezes. No luto, a cabeça fica sobrecarregada. Anote compromissos, use lembretes, divida tarefas. Isso costuma melhorar com o tempo. Seja paciente com você.","pratica":"Use o celular para anotar os compromissos desta semana.","pergunta_diario":"Em que situações você tem sentido mais dificuldade de atenção?"},{"dia":37,"titulo":"Mais uma semana","mensagem":"Mais uma semana atravessada. Olhe para os pequenos avanços, mesmo que pareçam nada: sair de casa, rir de algo, dormir um pouco melhor, conversar com alguém. E olhe também para os dias difíceis, sem cobrança. Os dois fazem parte.","pratica":"Escreva um pequeno avanço e um dia difícil desta semana.","pergunta_diario":"O que você aprendeu sobre você nessas semanas?"},{"dia":38,"titulo":"Fotos e vídeos","mensagem":"Rever fotos e vídeos pode trazer conforto ou dor, às vezes os dois. Não existe hora certa para isso. Se quiser, comece com poucas, num momento calmo, talvez com alguém do lado. Você pode separar as preferidas na sua caixa de memórias.","pratica":"Escolha três fotos favoritas e guarde no app.","pergunta_diario":"Que foto mais representa essa pessoa?"},{"dia":39,"titulo":"Quando alguém fala algo que machuca","mensagem":"Frases como 'ele está num lugar melhor', 'pelo menos ela não sofre mais' ou 'você precisa seguir em frente' são ditas com boa intenção, mas podem doer. Você pode responder com calma: 'Obrigado, mas ainda está difícil para mim.' Não precisa concordar.","pratica":"Escreva a frase que mais te machucou e o que você gostaria de ter respondido.","pergunta_diario":"Que tipo de apoio realmente ajuda você?"},{"dia":40,"titulo":"A voz","mensagem":"Muita gente sente medo de esquecer a voz, o jeito de falar, a risada. Se você tiver áudios ou vídeos, guarde em lugar seguro. Se não tiver, escreva as frases que essa pessoa sempre dizia. Elas ficam guardadas para sempre.","pratica":"Escreva no diário três frases típicas dessa pessoa.","pergunta_diario":"Que frase dela você nunca quer esquecer?"},{"dia":41,"titulo":"Sentir-se diferente","mensagem":"A perda muda a gente. Você pode notar que seus interesses mudaram, que algumas amizades se aproximaram e outras se afastaram, que você vê a vida de outro jeito. Isso faz parte. Você continua sendo você, com uma história nova em cima.","pratica":"Observe uma coisa que mudou em você e escreva sem julgar.","pergunta_diario":"O que mudou na forma como você vê a vida?"},{"dia":42,"titulo":"Pequenos prazeres","mensagem":"Um café quentinho, um banho demorado, uma série, um passeio, um doce. Pequenos prazeres não são falta de respeito com a dor. São respiros. Você pode se permitir alguns durante a semana.","pratica":"Escolha um pequeno prazer para hoje.","pergunta_diario":"O que costumava te fazer bem antes e você ainda não voltou a fazer?"},{"dia":43,"titulo":"Escrever para seguir","mensagem":"Escrever ajuda a organizar o que está bagunçado por dentro. Não precisa ser bonito. Pode ser uma lista, uma carta, uma frase solta. O seu diário é um lugar seguro, só seu.","pratica":"Escreva por cinco minutos sem parar, sobre qualquer coisa.","pergunta_diario":"O que você ainda não falou para ninguém?"},{"dia":44,"titulo":"As pessoas perguntam menos","mensagem":"Já são mais de seis semanas. Talvez as pessoas já não perguntem tanto. Talvez você também queira falar menos. Mas a saudade continua, e tudo bem. Ela não tem prazo de validade.","pratica":"Mande um áudio ou mensagem para alguém que também sente falta dessa pessoa.","pergunta_diario":"Quem divide essa saudade com você?"},{"dia":45,"titulo":"Os papéis e as decisões","mensagem":"Pode haver coisas práticas para resolver: documentos, contas, decisões sobre a casa. Faça aos poucos, com ajuda, sem pressa desnecessária. Se for possível, peça para alguém de confiança acompanhar. Decisões grandes, como vender um imóvel ou mudar de cidade, costumam ficar melhores quando não são tomadas no impulso dos primeiros meses.","pratica":"Liste as decisões que precisam ser tomadas e marque quais podem esperar.","pergunta_diario":"Qual decisão mais pesa para você agora?"},{"dia":46,"titulo":"Cansaço de ser forte","mensagem":"Às vezes você cuida de todo mundo: filhos, pais, irmãos, a casa, o trabalho. E fica sem espaço para a própria dor. Ser forte o tempo todo cansa. Procure um momento só seu, mesmo curto, para sentir sem precisar segurar.","pratica":"Reserve quinze minutos hoje só para você.","pergunta_diario":"Quem cuida de você enquanto você cuida dos outros?"},{"dia":47,"titulo":"O que eu sinto falta","mensagem":"Às vezes ajuda nomear exatamente do que você sente falta: das conversas, dos conselhos, do abraço, das brigas bobas, de ter alguém esperando em casa. Nomear não diminui a falta, mas ajuda a entender o que essa pessoa representava.","pratica":"Faça uma lista começando com: Eu sinto falta de...","pergunta_diario":"De qual dessas faltas você mais quer cuidar?"},{"dia":48,"titulo":"Companhia","mensagem":"Você não precisa conversar sobre a perda para ter companhia. Às vezes basta estar junto: ver um filme, cozinhar, caminhar, tomar um café. Companhia sem cobrança também acolhe.","pratica":"Convide alguém para fazer algo simples com você nesta semana.","pergunta_diario":"Com quem você gosta de estar em silêncio?"},{"dia":49,"titulo":"Onde mora a saudade","mensagem":"Tem lugares em que a saudade aperta mais: a casa, o carro, a cidade, a igreja, o bairro. Tem lugares em que ela fica mais leve. Perceber isso ajuda a escolher onde estar nos dias mais difíceis.","pratica":"Escolha um lugar para ir quando precisar de calma.","pergunta_diario":"Em que lugares você sente mais a presença dessa pessoa?"},{"dia":50,"titulo":"Rir de novo","mensagem":"Um dia, alguma coisa vai fazer você rir de verdade. E talvez venha um susto. Rir não diminui o amor. Muita gente percebe que quem partiu também ria muito, e lembrar disso traz paz.","pratica":"Lembre de uma coisa engraçada que essa pessoa fazia.","pergunta_diario":"Qual era o jeito de rir dela?"},{"dia":51,"titulo":"Seu tesouro de lembranças","mensagem":"Mais uma semana. Que tal olhar para a sua caixa de memórias e ver o que você já guardou? Fotos, cartas, frases, lembranças. Isso é um tesouro que só você tem.","pratica":"Adicione uma nova lembrança à caixa de memórias.","pergunta_diario":"Que lembrança você ainda quer registrar?"},{"dia":52,"titulo":"Datas pequenas","mensagem":"Além das grandes datas, existem as pequenas: o dia da semana em que vocês se viam, o horário do telefonema, o mês em que algo importante aconteceu. Elas também podem pesar. Reconhecer isso ajuda a se preparar.","pratica":"Escreva quais 'datas pequenas' pesam para você.","pergunta_diario":"Que dia da semana é mais difícil?"},{"dia":53,"titulo":"Cuidar da saúde","mensagem":"Com tanta coisa acontecendo, a saúde fica de lado: consultas atrasadas, remédios esquecidos, exames adiados. Cuidar de si é também uma forma de honrar quem partiu e quem continua com você.","pratica":"Verifique se há alguma consulta ou remédio que você deixou de lado.","pergunta_diario":"Como você tem cuidado da sua saúde?"},{"dia":54,"titulo":"Conversar com quem partiu","mensagem":"Muitas pessoas conversam com quem partiu: no túmulo, em oração, em voz alta em casa, numa carta. Se isso fizer sentido para você, faça. É uma forma de continuar o vínculo.","pratica":"Escreva uma carta contando as novidades desta semana.","pergunta_diario":"O que você contaria para essa pessoa hoje?"},{"dia":55,"titulo":"Quando o mundo comemora","mensagem":"Festas, aniversários de outras pessoas, encontros de família. Ir pode ser difícil, não ir também. Você pode ir por pouco tempo, combinar uma saída antecipada, levar alguém de confiança. Você decide até onde dá.","pratica":"Se tiver um evento chegando, combine com alguém um roteiro de saída.","pergunta_diario":"Que tipo de evento está mais difícil agora?"},{"dia":56,"titulo":"A culpa de seguir","mensagem":"Voltar ao trabalho, fazer sonhos, comprar algo novo, viajar. Pode vir uma sensação de traição. Seguir vivendo não é esquecer. É carregar quem você ama junto, nos passos que você dá.","pratica":"Faça um pequeno roteiro para o próximo mês.","pergunta_diario":"O que você acha que essa pessoa diria sobre você seguir?"},{"dia":57,"titulo":"A saudade muda de forma","mensagem":"Mais de oito semanas. A dor talvez esteja diferente, mais funda ou mais quieta. O luto muda de forma com o tempo. Observar essas mudanças sem pressa ajuda a entender o seu próprio caminho.","pratica":"Escreva uma palavra que descreva como está a sua saudade hoje.","pergunta_diario":"Como a sua saudade mudou nessas semanas?"},{"dia":58,"titulo":"Um álbum de vida","mensagem":"Em vez de lembrar só do fim, lembre da vida inteira: a infância que você conheceu por histórias, a juventude, as fases, as conquistas. Montar um álbum, físico ou no app, ajuda a olhar para a pessoa por inteiro, não só para a partida.","pratica":"Separe uma foto de cada fase da vida dessa pessoa.","pergunta_diario":"Que fase da vida dela você gostaria de conhecer melhor?"},{"dia":59,"titulo":"Perguntar aos outros","mensagem":"Amigos, colegas e parentes guardam histórias que você talvez não conheça. Perguntar 'você tem alguma lembrança dela?' pode trazer presentes inesperados e aproximar quem também sente falta.","pratica":"Peça a alguém que conte uma lembrança dessa pessoa.","pergunta_diario":"Que história nova você gostaria de ouvir?"},{"dia":60,"titulo":"Dois meses","mensagem":"Dois meses. Pode parecer muito ou pouco tempo, dependendo do dia. Não existe ritmo certo. Talvez você esteja aprendendo a viver com a ausência, talvez ainda pareça impossível. Os dois sentimentos são verdadeiros. Continue no seu tempo.","pratica":"Releia uma entrada antiga do diário.","pergunta_diario":"O que você diria para você mesmo de dois meses atrás?"},{"dia":61,"titulo":"Pedir ajuda prática","mensagem":"Se ainda há tarefas pesadas, como organizar documentos, resolver contas ou cuidar dos pertences, você pode dividir com alguém. Às vezes, uma tarde com ajuda resolve o que você adia há semanas.","pratica":"Escolha uma tarefa pesada e convide alguém para fazer junto.","pergunta_diario":"Que tarefa você vem adiando?"},{"dia":62,"titulo":"O que você precisa hoje","mensagem":"Hoje, em vez de uma reflexão, uma pergunta simples: do que você precisa agora? Descanso? Companhia? Silêncio? Chorar? Sair? Ouvir a si mesmo é o primeiro passo para cuidar de si.","pratica":"Faça uma coisa que responda à sua necessidade de hoje.","pergunta_diario":"Do que você precisa hoje?"},{"dia":63,"titulo":"Os valores que ficam","mensagem":"Honestidade, generosidade, humor, coragem, fé, trabalho. Que valores marcavam essa pessoa? Viver alguns deles é uma forma bonita de manter a presença dela no mundo.","pratica":"Faça hoje um pequeno gesto inspirado num valor dessa pessoa.","pergunta_diario":"Que valor dela você quer levar adiante?"},{"dia":64,"titulo":"O vai e vem","mensagem":"Já passou de dois meses. Talvez você note que consegue passar algumas horas sem pensar na perda, e logo depois a saudade volta forte. Esse vai e vem é comum. Não significa que você está esquecendo.","pratica":"Observe o vai e vem da saudade hoje, sem julgar.","pergunta_diario":"Em que momentos você consegue descansar um pouco da dor?"},{"dia":65,"titulo":"Família em luto","mensagem":"Cada pessoa da família sente de um jeito. Uns falam, outros se fecham, outros brigam. Isso pode gerar distância ou conflito. Ter paciência com o jeito do outro ajuda, e também colocar limites quando necessário.","pratica":"Pense em alguém da família que está sofrendo de outro jeito e mande um carinho.","pergunta_diario":"Como sua família tem vivido essa perda?"},{"dia":66,"titulo":"O corpo pede movimento","mensagem":"Movimentar o corpo ajuda a aliviar a tensão: caminhar, alongar, dançar uma música, cuidar do jardim. Não precisa ser exercício pesado. Pequenos movimentos já fazem diferença.","pratica":"Faça cinco minutos de alongamento ou uma caminhada.","pergunta_diario":"Que movimento te faz bem?"},{"dia":67,"titulo":"Sonhos","mensagem":"Algumas pessoas sonham com quem partiu. Sonhos podem trazer conforto ou tristeza. Se quiser, registre no diário. Eles também fazem parte da forma como a mente vive a saudade.","pratica":"Se sonhar com essa pessoa, anote ao acordar.","pergunta_diario":"Você já sonhou com essa pessoa? Como foi?"},{"dia":68,"titulo":"Ser paciente com você","mensagem":"Não existe um ponto em que a saudade some. Existe aprender a viver com ela. Algumas semanas vão parecer passos para trás. Não são. É o luto seguindo o caminho dele.","pratica":"Escreva uma frase gentil para você mesmo.","pergunta_diario":"O que você diria para alguém que está na mesma situação?"},{"dia":69,"titulo":"Dias cinzentos","mensagem":"Alguns dias amanhecem pesados sem motivo aparente. Não precisa explicar nem justificar. Nesses dias, o objetivo pode ser só atravessar: o mínimo de tarefas, o máximo de gentileza com você.","pratica":"Hoje, faça só o essencial e descanse sem culpa.","pergunta_diario":"O que ajuda você a atravessar um dia cinzento?"},{"dia":70,"titulo":"Música","mensagem":"Algumas músicas machucam, outras abraçam. Montar uma lista com as músicas que lembram essa pessoa pode virar um ritual de lembrança. E também está tudo bem pular as que ainda doem demais.","pratica":"Monte uma lista com três músicas que lembram essa pessoa.","pergunta_diario":"Que música fala dessa saudade?"},{"dia":71,"titulo":"Novas pequenas alegrias","mensagem":"Uma planta que floresceu, um encontro bom, uma comida gostosa, um abraço de criança. Alegrias pequenas continuam acontecendo. Notar não diminui a dor, mas lembra que ainda há coisas boas.","pratica":"Fotografe algo bonito que você ver hoje.","pergunta_diario":"Que coisa pequena te alegrou recentemente?"},{"dia":72,"titulo":"Quando ajudar outra pessoa","mensagem":"Às vezes, ajudar alguém que está passando por algo parecido dá sentido à dor. Uma mensagem, uma visita, uma escuta. Só faça se sentir que tem energia para isso. Primeiro, cuide de você.","pratica":"Pense se há alguém que também está de luto e que gostaria de uma mensagem.","pergunta_diario":"Que tipo de apoio você gostaria de ter recebido?"},{"dia":73,"titulo":"A data mensal","mensagem":"Muita gente sente o peso todo mês, no mesmo dia da partida. Se for o seu caso, você pode reservar esse dia para um gesto de lembrança: uma vela, uma oração, uma visita, uma música.","pratica":"Defina um gesto para o dia do mês que mais pesa.","pergunta_diario":"Como tem sido esse dia a cada mês?"},{"dia":74,"titulo":"Revisitar lugares","mensagem":"Voltar a lugares que vocês frequentavam juntos pode ser difícil e, ao mesmo tempo, importante. Vá quando se sentir pronto, talvez com alguém, talvez sozinho. Não há obrigação.","pratica":"Escolha um lugar significativo que você gostaria de visitar no futuro.","pergunta_diario":"Que lugar guarda mais lembranças de vocês?"},{"dia":75,"titulo":"Pausas no dia","mensagem":"Fazer pequenas pausas ao longo do dia ajuda: três respirações antes de uma tarefa, um minuto olhando pela janela, um copo de água. São respiros num período pesado.","pratica":"Faça três pausas curtas ao longo do dia de hoje.","pergunta_diario":"Em que hora do dia você mais precisa de pausa?"},{"dia":76,"titulo":"Receitas e sabores","mensagem":"Um tempero, um bolo, um café passado de um jeito especial. Cozinhar a receita de quem partiu pode ser uma forma de trazer a presença para a mesa. Se ninguém sabe a receita certa, recriar do seu jeito também vale.","pratica":"Escreva no diário uma receita ou um sabor que lembra essa pessoa.","pergunta_diario":"Que comida tinha a cara dela?"},{"dia":77,"titulo":"Trabalho e luto","mensagem":"Voltar ao trabalho pode ajudar a dar estrutura ou pode pesar muito. Se for possível, converse com quem lidera você sobre o que está vivendo. Pequenos ajustes, como pausas e prazos, fazem diferença.","pratica":"Pense em um ajuste que facilitaria seu dia de trabalho.","pergunta_diario":"Como tem sido trabalhar com essa saudade?"},{"dia":78,"titulo":"Medo de esquecer","mensagem":"Com o tempo, alguns detalhes ficam menos nítidos, e isso assusta. Esquecer um detalhe não é esquecer a pessoa. O que ela significou continua em você. Registrar lembranças no app é uma forma de guardar o que importa.","pratica":"Registre hoje um detalhe que você não quer perder.","pergunta_diario":"Que detalhe você mais tem medo de esquecer?"},{"dia":79,"titulo":"O seu jeito de carregar","mensagem":"Mais uma semana. Aos poucos, você vai encontrando um jeito seu de carregar essa ausência. Às vezes leve, às vezes pesado. Tudo isso faz parte do caminho.","pratica":"Escreva como você está carregando essa saudade hoje.","pergunta_diario":"O que tem ajudado mais nesse caminho?"},{"dia":80,"titulo":"Sentir raiva de novo","mensagem":"A raiva pode voltar meses depois, de repente: das circunstâncias, de alguém, da vida. Ela não é errada. Encontrar um jeito seguro de colocar para fora, como escrever, caminhar forte, conversar, evita que ela fique presa.","pratica":"Escreva tudo o que deixa você com raiva e depois feche o diário.","pergunta_diario":"O que a sua raiva está tentando dizer?"},{"dia":81,"titulo":"Limites","mensagem":"Você pode dizer não a convites, visitas, perguntas e conversas que pesam demais agora. Colocar limites não é falta de educação, é cuidado. As pessoas que gostam de você vão entender.","pratica":"Escreva uma situação em que você precisa dizer não.","pergunta_diario":"Onde você precisa colocar mais limites?"},{"dia":82,"titulo":"Fé e espiritualidade","mensagem":"Para algumas pessoas, a fé conforta. Para outras, a perda traz dúvidas e até revolta. As duas reações são humanas. Se a sua fé é importante, deixe que ela acolha você. Se está em dúvida, tudo bem também.","pratica":"Faça hoje o que traz paz para você, seja uma oração, um silêncio ou um passeio.","pergunta_diario":"O que tem dado sentido aos seus dias?"},{"dia":83,"titulo":"Pessoas novas","mensagem":"Conhecer gente nova pode trazer um desconforto: elas não conheceram quem partiu. Você pode falar dessa pessoa quando quiser e no ritmo que quiser. Contar quem ela foi é uma forma de mantê-la viva nas suas histórias.","pratica":"Pense em como você gostaria de apresentar essa pessoa a alguém novo.","pergunta_diario":"Como você descreveria essa pessoa em três palavras?"},{"dia":84,"titulo":"Reconhecer o caminho","mensagem":"Quase lá: três meses. Quanta coisa você atravessou. Se olhar com cuidado, vai perceber que, mesmo nos piores dias, você continuou. Isso merece reconhecimento.","pratica":"Faça algo especial e simples para marcar esta semana.","pergunta_diario":"De que você se orgulha nesses três meses?"},{"dia":85,"titulo":"Cuidar dos que ficaram","mensagem":"Pode haver crianças, idosos ou outras pessoas que dependem de você e também sentem a perda. Cuidar deles enquanto você sofre é pesado. Peça apoio para dividir esse cuidado sempre que possível.","pratica":"Pense em quem pode dividir o cuidado com você nesta semana.","pergunta_diario":"Quem mais está sentindo essa perda perto de você?"},{"dia":86,"titulo":"Um dia de cada vez","mensagem":"Quando o futuro assusta, volte para o hoje. O que dá para fazer só hoje? Às vezes, pensar em semanas e meses pesa demais. Um dia de cada vez já é um caminho inteiro.","pratica":"Escreva só o roteiro de hoje, nada além.","pergunta_diario":"O que dá para fazer só por hoje?"},{"dia":87,"titulo":"O que o luto ensina","mensagem":"Muita gente percebe, com o tempo, que a perda mudou suas prioridades: mais tempo com quem ama, menos com o que não importa. Não é que a dor valeu a pena. É que, mesmo nela, você está aprendendo.","pratica":"Escreva uma prioridade que mudou para você.","pergunta_diario":"O que ficou mais importante na sua vida?"},{"dia":88,"titulo":"Preparar o próximo passo","mensagem":"Daqui a poucos dias você completa três meses. Pense no que gostaria para os próximos meses: um hábito, um lugar para visitar, uma pessoa para se aproximar, uma homenagem. Pequenos sonhos ajudam a dar direção.","pratica":"Escreva um desejo para os próximos três meses.","pergunta_diario":"O que você gostaria que fosse diferente daqui a três meses?"},{"dia":89,"titulo":"Datas que se aproximam","mensagem":"Olhe para os próximos meses: há algum aniversário, data comemorativa ou data especial chegando? Cadastrar no app ajuda a receber uma mensagem preparada e a se organizar.","pratica":"Confira as datas cadastradas e adicione as que faltarem.","pergunta_diario":"Como você gostaria de passar a próxima data importante?"},{"dia":90,"titulo":"Três meses","mensagem":"Três meses. É um marco. Não de cura, porque a saudade não tem fim marcado, mas de travessia. Você atravessou o começo, que costuma ser o período mais desorientador. Daqui para frente, as mensagens vão chegar algumas vezes por semana, acompanhando você até completar um ano.","pratica":"Releia o que escreveu no primeiro dia e no dia 30.","pergunta_diario":"O que você quer dizer para quem partiu, depois desses três meses?"},{"dia":91,"titulo":"Um novo ritmo","mensagem":"A partir de agora, as mensagens chegam algumas vezes por semana. Nos outros dias, o diário, as cartas e as memórias continuam aqui sempre que você quiser. Use o app no seu ritmo.","pratica":"Escolha os dias da semana em que você quer abrir o app.","pergunta_diario":"Como você quer usar este espaço daqui para frente?"},{"dia":94,"titulo":"Uma pausa para você","mensagem":"Hoje, só uma pausa. Respire, beba água, olhe pela janela. Você não precisa fazer nada além de cuidar de você por alguns minutos.","pratica":"Faça a respiração do botão Quando apertar.","pergunta_diario":"Como você está agora, de verdade?"},{"dia":98,"titulo":"O ano das primeiras vezes","mensagem":"O primeiro ano costuma ser feito de primeiras vezes: o primeiro aniversário sem a pessoa, o primeiro Natal, a primeira viagem. Cada uma pode pesar. Saber disso ajuda a se preparar e a ser gentil com você.","pratica":"Liste as primeiras vezes que ainda vão chegar este ano.","pergunta_diario":"Qual primeira vez você mais teme?"},{"dia":101,"titulo":"Uma carta curta","mensagem":"Escreva algumas linhas para quem partiu, contando algo simples do seu dia. Conversar assim mantém o vínculo vivo.","pratica":"Escreva três linhas para essa pessoa.","pergunta_diario":"O que você contaria sobre o seu dia?"},{"dia":105,"titulo":"Perdas que vêm junto","mensagem":"Junto com a pessoa, às vezes vão embora outras coisas: uma renda, uma casa, uma rotina, um papel na família, amigos em comum. Essas perdas também merecem atenção e tempo.","pratica":"Escreva quais outras perdas vieram junto com essa.","pergunta_diario":"Qual dessas perdas tem sido mais difícil?"},{"dia":108,"titulo":"Memória da semana","mensagem":"Que lembrança apareceu nesta semana? Guarde no app. Cada lembrança registrada é um pedaço da história de vocês.","pratica":"Registre uma lembrança na caixa de memórias.","pergunta_diario":"Que lembrança apareceu nesta semana?"},{"dia":112,"titulo":"Velhos hábitos","mensagem":"Pegar o celular para ligar, comprar o que ela gostava, separar dois pratos. Hábitos antigos aparecem sem aviso e doem. Com o tempo, eles se transformam. Não precisa forçar a mudança.","pratica":"Perceba hoje um hábito antigo, sem se cobrar.","pergunta_diario":"Que hábito ainda faz você lembrar dessa pessoa?"},{"dia":115,"titulo":"Gentileza","mensagem":"Seja tão gentil com você quanto você é com quem ama. Fale consigo com calma, sem cobrança.","pratica":"Escreva uma frase gentil para você.","pergunta_diario":"O que você precisa ouvir hoje?"},{"dia":120,"titulo":"Quatro meses","mensagem":"Quatro meses. As pessoas talvez achem que você já deveria estar melhor. Mas o luto não segue a expectativa de ninguém. Você continua no seu tempo, e isso é legítimo.","pratica":"Faça algo gentil por você hoje.","pergunta_diario":"O que os outros não entendem sobre a sua saudade?"},{"dia":122,"titulo":"Amizades que mudam","mensagem":"Algumas amizades se aproximam no luto, outras se afastam. Isso costuma machucar. Às vezes, quem se afasta não sabe lidar com a dor. Você pode procurar quem fica e, se quiser, explicar do que precisa.","pratica":"Agradeça a alguém que esteve presente.","pergunta_diario":"Quem surpreendeu você nesses meses?"},{"dia":126,"titulo":"Um café com alguém","mensagem":"Procure alguém para um café, uma ligação, um passeio. Companhia não precisa de assunto.","pratica":"Combine um encontro simples nesta semana.","pergunta_diario":"Com quem você quer estar mais perto?"},{"dia":129,"titulo":"Pedir o que você precisa","mensagem":"As pessoas acertam mais quando sabem o que fazer. Dizer 'gosto quando você fala o nome dela' ou 'prefiro não falar disso hoje' ajuda quem está perto a cuidar melhor de você.","pratica":"Escreva uma frase dizendo do que você precisa e envie a alguém próximo.","pergunta_diario":"O que você gostaria que as pessoas soubessem?"},{"dia":133,"titulo":"Um gesto em nome dela","mensagem":"Faça algo pequeno em nome de quem partiu: ajudar alguém, preparar a comida preferida, cuidar de uma planta.","pratica":"Escolha e faça um gesto em homenagem.","pergunta_diario":"Que gesto teria a cara dessa pessoa?"},{"dia":136,"titulo":"Ritual de lembrança","mensagem":"Rituais dão um lugar para a saudade: acender uma vela no domingo, visitar o cemitério num dia fixo, rezar, olhar fotos com a família. Criar um ritual seu pode trazer paz.","pratica":"Escolha um pequeno ritual semanal.","pergunta_diario":"Que ritual teria sentido para vocês?"},{"dia":140,"titulo":"Quando a saudade volta forte","mensagem":"Depois de dias mais leves, a saudade pode voltar com força. Não é recaída nem retrocesso. É a onda que ainda vem. Use o botão Quando apertar sempre que precisar.","pratica":"Na próxima onda, respire e escreva o que a trouxe.","pergunta_diario":"O que trouxe a última onda forte?"},{"dia":143,"titulo":"Corpo em movimento","mensagem":"Caminhar, alongar, dançar. Movimentar o corpo ajuda a soltar o que fica preso.","pratica":"Movimente o corpo por dez minutos.","pergunta_diario":"Que movimento faz bem para você?"},{"dia":147,"titulo":"O valor do descanso","mensagem":"Luto cansa. Mesmo meses depois, você pode sentir mais sono, menos energia. Descansar não é preguiça. É o corpo pedindo tempo para se reorganizar.","pratica":"Programe um descanso sem culpa nesta semana.","pergunta_diario":"Quando foi a última vez que você descansou de verdade?"},{"dia":150,"titulo":"Cinco meses","mensagem":"Cinco meses. Talvez você perceba que já consegue falar dessa pessoa com mais calma em alguns momentos. E, em outros, a dor é a mesma. Os dois estados convivem.","pratica":"Conte uma lembrança para alguém hoje.","pergunta_diario":"Em que momentos já é possível falar com mais calma?"},{"dia":154,"titulo":"Noite tranquila","mensagem":"Prepare uma noite mais calma: luz baixa, celular longe, uma música suave, respiração lenta.","pratica":"Desligue as telas meia hora antes de dormir.","pergunta_diario":"Como têm sido as suas noites?"},{"dia":157,"titulo":"Quem eu sou agora","mensagem":"Filho sem pai, mãe sem filho, viúvo, amigo sem o amigo. A perda muda a forma como a gente se vê. Encontrar quem você é agora leva tempo. Não precisa ter resposta pronta.","pratica":"Escreva três palavras sobre quem você é hoje.","pergunta_diario":"O que mudou na forma como você se enxerga?"},{"dia":161,"titulo":"Olhar o caminho","mensagem":"Releia algo que você escreveu meses atrás. Perceba o que mudou e o que continua.","pratica":"Releia uma entrada antiga do diário.","pergunta_diario":"O que mudou desde aquela época?"},{"dia":164,"titulo":"A herança afetiva","mensagem":"Além de objetos e bens, existe uma herança que não está no papel: jeito de cuidar, risada, teimosia, coragem, receitas, histórias. Essa herança está viva em você e em quem conviveu com essa pessoa.","pratica":"Escreva o que você herdou dessa pessoa que não está em nenhum documento.","pergunta_diario":"Que herança afetiva você quer passar adiante?"},{"dia":168,"titulo":"Uma música","mensagem":"Ouça uma música que lembra essa pessoa. Se doer demais, escolha outra que acolha você.","pratica":"Ouça uma música com atenção, sem fazer outra coisa.","pergunta_diario":"O que essa música desperta em você?"},{"dia":171,"titulo":"Ajudar sem se esgotar","mensagem":"Se você está cuidando de outras pessoas da família no luto, lembre-se de que você também está de luto. Dividir tarefas e pedir apoio é necessário.","pratica":"Pergunte a alguém da família como ele está e diga também como você está.","pergunta_diario":"Quem tem cuidado de você?"},{"dia":175,"titulo":"Natureza por perto","mensagem":"Fique alguns minutos ao ar livre, observe o céu, as árvores, o movimento da rua. Pequenas pausas lá fora renovam.","pratica":"Passe dez minutos ao ar livre.","pergunta_diario":"O que você notou lá fora?"},{"dia":178,"titulo":"Lugares novos","mensagem":"Ir a um lugar novo pode trazer alívio, porque não guarda lembranças doloridas. Pode ser um parque, uma cidade próxima, um café diferente. Não é fugir, é respirar.","pratica":"Planeje uma visita a um lugar novo.","pergunta_diario":"Que lugar novo você gostaria de conhecer?"},{"dia":180,"titulo":"Seis meses","mensagem":"Meio ano. Muita gente sente esse marco com força. Você atravessou estações inteiras com essa ausência. Olhe para tudo o que você carregou até aqui, com respeito pelo seu caminho.","pratica":"Faça um gesto de homenagem para marcar os seis meses.","pergunta_diario":"O que esses seis meses ensinaram sobre você?"},{"dia":182,"titulo":"Sentir sem pressa","mensagem":"Hoje, se a saudade aparecer, deixe ela ficar um pouco. Não precisa espantar nem resolver.","pratica":"Escreva o que você sente, sem tentar mudar.","pergunta_diario":"Como está a sua saudade hoje?"},{"dia":185,"titulo":"Escrever a história","mensagem":"Algumas pessoas sentem vontade de escrever a história de quem partiu: de onde veio, como era, o que viveu. Pode virar um texto para a família, um álbum, um livro de memórias no app.","pratica":"Escreva o primeiro parágrafo da história dessa pessoa.","pergunta_diario":"Como você começaria a contar a vida dela?"},{"dia":189,"titulo":"Pedir ajuda","mensagem":"Se algo está pesado demais, divida com alguém. Pedir ajuda é coragem, não fraqueza.","pratica":"Peça ajuda para uma coisa específica.","pergunta_diario":"O que está pesado demais agora?"},{"dia":192,"titulo":"Silêncio sem medo","mensagem":"Às vezes o silêncio assusta porque deixa os pensamentos aparecerem. Experimente ficar alguns minutos em silêncio, respirando, sem tentar resolver nada. O silêncio também pode acolher.","pratica":"Fique três minutos em silêncio, só respirando.","pergunta_diario":"Como você se sente quando a casa fica quieta?"},{"dia":196,"titulo":"Riso e lembrança","mensagem":"Lembre de uma situação engraçada que vocês viveram. Rir lembrando também é homenagem.","pratica":"Conte essa situação para alguém.","pergunta_diario":"Qual foi a situação mais engraçada que vocês viveram?"},{"dia":199,"titulo":"Saudade no corpo","mensagem":"Às vezes a saudade aparece como dor de cabeça, aperto no estômago, cansaço. Perceber onde ela aparece no corpo ajuda a cuidar. Se algum sintoma persistir, procure um médico.","pratica":"Coloque a mão onde você sente a saudade no corpo e respire ali.","pergunta_diario":"Onde a saudade aparece no seu corpo?"},{"dia":203,"titulo":"Cuidar da casa","mensagem":"Arrumar um cantinho da casa pode trazer sensação de ordem. Não precisa ser tudo, só um canto.","pratica":"Arrume um pequeno espaço da casa.","pergunta_diario":"Que canto da casa precisa de carinho?"},{"dia":206,"titulo":"Sonhos que ficaram","mensagem":"Viagens que vocês iam fazer, festas que iam acontecer, sonhos em comum. Os sonhos que ficaram pelo caminho também doem. Alguns podem ser realizados em homenagem; outros, apenas guardados com carinho.","pratica":"Escreva um roteiro que vocês tinham juntos.","pergunta_diario":"Algum sonho pode ser realizado em homenagem?"},{"dia":210,"titulo":"Sete meses","mensagem":"Sete meses. Talvez você já tenha encontrado formas de manter essa pessoa por perto: rituais, histórias, objetos, gestos. Continue cultivando o que faz sentido para você.","pratica":"Escreva uma forma de manter essa pessoa perto que funciona para você.","pergunta_diario":"O que mais ajuda você a sentir essa presença?"},{"dia":213,"titulo":"Valores vivos","mensagem":"Que valor dessa pessoa você colocou em prática nesta semana? Esse é um jeito de ela continuar no mundo.","pratica":"Pratique hoje um valor dessa pessoa.","pergunta_diario":"Que valor você viveu nesta semana?"},{"dia":217,"titulo":"A segunda metade","mensagem":"A segunda metade do primeiro ano costuma trazer algo diferente: menos choque, mais saudade tranquila, e também datas importantes chegando. Continue contando com este espaço.","pratica":"Revise as datas importantes dos próximos seis meses.","pergunta_diario":"O que você espera da segunda metade deste ano?"},{"dia":220,"titulo":"Datas da semana","mensagem":"Há alguma data importante nos próximos dias? Prepare-se com antecedência, com companhia e um roteiro simples.","pratica":"Confira as datas cadastradas no app.","pergunta_diario":"O que você precisa para atravessar a próxima data?"},{"dia":224,"titulo":"Abraçar as contradições","mensagem":"Você pode sentir saudade e alívio, tristeza e gratidão, vontade de lembrar e vontade de esquecer, tudo no mesmo dia. Sentimentos contraditórios são comuns e não anulam o amor.","pratica":"Escreva dois sentimentos opostos que você sentiu nesta semana.","pergunta_diario":"Que contradições aparecem em você?"},{"dia":227,"titulo":"Fotos novas","mensagem":"Tirar fotos novas, de momentos novos, pode parecer estranho. Mas a vida continua acontecendo, e essas fotos também contam a sua história, que inclui a saudade.","pratica":"Tire uma foto de um momento bom desta semana.","pergunta_diario":"Que momento recente você gostaria de guardar?"},{"dia":231,"titulo":"Fé, silêncio ou oração","mensagem":"Se fizer sentido para você, reserve um momento de oração, meditação ou silêncio. Cada um encontra paz de um jeito.","pratica":"Reserve cinco minutos para o seu momento de paz.","pergunta_diario":"Onde você encontra paz?"},{"dia":234,"titulo":"Datas que passaram","mensagem":"Algumas datas importantes talvez já tenham passado. Como foi? Pior ou melhor do que você imaginou? Olhar para isso ajuda a se preparar para as próximas.","pratica":"Escreva como foi a última data importante.","pergunta_diario":"O que você faria diferente na próxima data?"},{"dia":238,"titulo":"Agradecer","mensagem":"Agradeça por uma coisa boa da semana, por menor que seja. Isso não nega a dor, só abre uma janela.","pratica":"Escreva uma coisa boa desta semana.","pergunta_diario":"O que trouxe um pouco de luz nesta semana?"},{"dia":240,"titulo":"Oito meses","mensagem":"Oito meses. Talvez a dor esteja mais quieta, talvez não. De qualquer forma, você vem aprendendo a viver com a saudade. Isso é uma forma de coragem.","pratica":"Escreva uma coisa que você aprendeu sobre a saudade.","pergunta_diario":"Como você descreveria a sua saudade hoje?"},{"dia":245,"titulo":"Voltar a algo que você gostava","mensagem":"Um hobby, um esporte, um grupo, uma atividade que você deixou de lado. Voltar aos poucos pode trazer um pouco de você de volta. Sem pressão, no seu tempo.","pratica":"Escolha algo que você gostava e faça por quinze minutos.","pergunta_diario":"Que atividade você sente falta de fazer?"},{"dia":248,"titulo":"Histórias da família","mensagem":"Pergunte a alguém da família uma história antiga dessa pessoa que você não conhece.","pratica":"Peça uma história nova a alguém.","pergunta_diario":"Que história nova você descobriu?"},{"dia":252,"titulo":"Conversas difíceis na família","mensagem":"Às vezes surgem conversas difíceis: sobre bens, decisões, mágoas antigas. Se possível, escolha um momento calmo, fale de você e escute. Quando ficar pesado demais, um mediador pode ajudar.","pratica":"Pense em uma conversa que precisa acontecer e no melhor momento para ela.","pergunta_diario":"Que conversa está pendente na sua família?"},{"dia":255,"titulo":"Descansar sem culpa","mensagem":"Hoje, permita-se descansar sem justificar. Descanso também é cuidado.","pratica":"Tire um tempo para descansar sem culpa.","pergunta_diario":"O que impede você de descansar?"},{"dia":259,"titulo":"Gentileza com o passado","mensagem":"Às vezes a mente volta para o que poderia ter sido feito diferente. Você fez o que conseguiu, com o que sabia e podia naquele momento. Olhe para o seu passado com a mesma gentileza que teria com alguém que ama.","pratica":"Escreva uma frase de perdão para você mesmo.","pergunta_diario":"O que você precisa perdoar em você?"},{"dia":262,"titulo":"O que a saudade pede","mensagem":"Às vezes a saudade pede lembrança, às vezes pede companhia, às vezes pede silêncio. Escute o que ela pede hoje.","pratica":"Faça o que a sua saudade está pedindo hoje.","pergunta_diario":"O que a sua saudade pede hoje?"},{"dia":266,"titulo":"Ser lembrado","mensagem":"Muita gente teme que quem partiu seja esquecido pelos outros. Você pode ajudar a manter essa memória viva: contando histórias, celebrando datas, fazendo algo em nome dela.","pratica":"Conte uma história dessa pessoa para alguém mais novo da família.","pergunta_diario":"Como você quer que essa pessoa seja lembrada?"},{"dia":270,"titulo":"Nove meses","mensagem":"Nove meses. O fim do primeiro ano está mais perto. Pode vir uma mistura de alívio e medo: alívio por ter atravessado, medo de que o tempo afaste a pessoa. O tempo não apaga o amor.","pratica":"Escreva o que você sente ao pensar que um ano está chegando.","pergunta_diario":"O que você quer fazer quando completar um ano?"},{"dia":273,"titulo":"Pequenos sonhos","mensagem":"Faça um pequeno roteiro para os próximos dias: um passeio, uma visita, uma receita. Ter algo para esperar ajuda.","pratica":"Marque algo simples para fazer nesta semana.","pergunta_diario":"O que você gostaria de esperar com alegria?"},{"dia":276,"titulo":"O tempo das pessoas","mensagem":"Cada pessoa da família vive o luto num tempo. Alguns parecem seguir rápido, outros não conseguem sair do lugar. Respeitar o tempo do outro evita mágoas.","pratica":"Respeite hoje o tempo de alguém diferente de você.","pergunta_diario":"Como cada pessoa da família tem vivido essa perda?"},{"dia":280,"titulo":"Respirar fundo","mensagem":"Três respirações lentas podem mudar um momento difícil. Volte para elas sempre que precisar.","pratica":"Respire fundo três vezes, devagar.","pergunta_diario":"Em que momento do dia você mais precisa respirar?"},{"dia":283,"titulo":"Natureza","mensagem":"Árvores que mudam, flores que nascem, o sol que volta todo dia. Observar a natureza lembra que a vida tem ciclos. Isso não apaga a perda, mas pode trazer um pouco de serenidade.","pratica":"Passe alguns minutos observando uma planta ou o céu.","pergunta_diario":"O que na natureza traz paz para você?"},{"dia":287,"titulo":"Fotografar o presente","mensagem":"Tire uma foto de algo bonito hoje. A vida continua tendo momentos que merecem ser guardados.","pratica":"Fotografe algo bonito hoje.","pergunta_diario":"O que de bonito você viu hoje?"},{"dia":290,"titulo":"Pequenos sinais","mensagem":"Uma borboleta, uma música no rádio, um cheiro conhecido. Muitas pessoas sentem que esses momentos são sinais de quem partiu. Se isso trouxer conforto para você, acolha.","pratica":"Registre no diário um momento que fez você lembrar dessa pessoa.","pergunta_diario":"Você já sentiu algum sinal dessa pessoa?"},{"dia":294,"titulo":"Escrever sem regra","mensagem":"Escreva livremente por cinco minutos. Sem corrigir, sem reler.","pratica":"Escreva por cinco minutos.","pergunta_diario":"O que saiu quando você escreveu sem regra?"},{"dia":297,"titulo":"Novas tradições","mensagem":"Algumas tradições não fazem mais sentido do mesmo jeito. Você pode adaptar, criar novas, incluir um momento de lembrança. Tradição também pode mudar.","pratica":"Pense em uma tradição que você quer adaptar.","pergunta_diario":"Que tradição da família mudou com essa ausência?"},{"dia":300,"titulo":"Dez meses","mensagem":"Dez meses. Já são muitas estações sem essa presença física. Ao mesmo tempo, quanta coisa você guardou: memórias, cartas, histórias. A presença continua de outro jeito.","pratica":"Releia uma das cartas que você escreveu.","pergunta_diario":"Como mudaram as suas cartas ao longo dos meses?"},{"dia":304,"titulo":"Lembrar com carinho","mensagem":"Pense numa característica dessa pessoa que você admirava muito. Guarde essa lembrança no app.","pratica":"Registre uma característica dela na caixa de memórias.","pergunta_diario":"O que você mais admirava nessa pessoa?"},{"dia":308,"titulo":"Corpo e mente juntos","mensagem":"Sono, alimentação, movimento e conversa sustentam você nesse período. Se algum desses pilares estiver muito abalado há muito tempo, vale procurar um profissional de saúde.","pratica":"Escolha um pilar para cuidar melhor nesta semana.","pergunta_diario":"Qual pilar está mais frágil agora?"},{"dia":311,"titulo":"Conversar sobre ela","mensagem":"Falar sobre quem partiu com quem também a conheceu traz histórias novas e aproxima.","pratica":"Converse sobre essa pessoa com alguém hoje.","pergunta_diario":"Com quem você gosta de falar sobre ela?"},{"dia":315,"titulo":"Gratidão pelas pessoas","mensagem":"Pense nas pessoas que seguraram sua mão nesses meses: um amigo, um vizinho, um colega, alguém da família. Agradecer fortalece os laços que sustentam você.","pratica":"Mande uma mensagem de agradecimento para alguém.","pergunta_diario":"Quem foi apoio importante neste ano?"},{"dia":318,"titulo":"Amor que não acaba","mensagem":"O vínculo com quem partiu não precisa terminar. Ele muda de forma: vira lembrança, inspiração, conversa interna, gesto. Muitas pessoas descobrem que o amor continua presente de um jeito novo.","pratica":"Escreva como esse amor está presente hoje.","pergunta_diario":"De que jeito novo esse amor aparece na sua vida?"},{"dia":322,"titulo":"Um passo de cada vez","mensagem":"Se algo parece grande demais, divida em passos pequenos. Um passo hoje já é suficiente.","pratica":"Escolha um passo pequeno e faça hoje.","pergunta_diario":"Que passo pequeno você pode dar hoje?"},{"dia":325,"titulo":"Contar para as crianças","mensagem":"Se há crianças na família, elas também guardam lembranças e perguntas. Contar histórias de quem partiu ajuda a manter a memória viva para elas, com palavras simples e verdadeiras.","pratica":"Conte uma história dessa pessoa para uma criança da família.","pergunta_diario":"Que lembrança você quer que as crianças guardem?"},{"dia":330,"titulo":"Onze meses","mensagem":"Onze meses. A reta final do primeiro ano costuma trazer lembranças fortes do ano anterior: o que vocês faziam juntos nessa época, os últimos momentos. Seja muito gentil com você nestas semanas.","pratica":"Reserve tempo para descanso e companhia nestas semanas.","pergunta_diario":"Que lembranças do ano passado estão vindo agora?"},{"dia":332,"titulo":"Saudade mansa","mensagem":"Em alguns dias, a saudade fica mais mansa. Perceber isso não é esquecer. É o amor encontrando lugar.","pratica":"Observe se a saudade está mais mansa hoje.","pergunta_diario":"Como a saudade tem aparecido nesta semana?"},{"dia":336,"titulo":"Olhar para frente","mensagem":"Olhar para frente não é deixar a pessoa para trás. É levar essa pessoa com você. Pensar em sonhos, por menores que sejam, é parte de continuar vivendo.","pratica":"Escreva um roteiro para os próximos meses.","pergunta_diario":"O que você gostaria de viver no próximo ano?"},{"dia":339,"titulo":"Cuidar de quem cuida","mensagem":"Se você cuida de outras pessoas, reserve um tempo para ser cuidado também.","pratica":"Peça a alguém um momento de cuidado para você.","pergunta_diario":"Quem pode cuidar de você nesta semana?"},{"dia":343,"titulo":"Preparar o aniversário de partida","mensagem":"A data de um ano costuma ser muito sentida, e a véspera também. Planeje com antecedência: com quem estar, se quer uma missa, culto, visita, encontro em família ou um momento só seu. O app vai mandar uma mensagem preparada nesse dia.","pratica":"Comece a pensar em como você quer viver a data de um ano.","pergunta_diario":"Como você gostaria de marcar um ano?"},{"dia":346,"titulo":"O seu jeito","mensagem":"Não existe um jeito certo de viver o luto. O seu jeito é válido, com os seus tempos e as suas formas.","pratica":"Escreva o que tem funcionado para você.","pergunta_diario":"O que tem ajudado você neste mês?"},{"dia":350,"titulo":"As pessoas que chegaram","mensagem":"Neste ano, talvez tenham chegado pessoas novas: alguém que escutou, um grupo de apoio, um amigo que se aproximou. A perda também abriu espaço para novos laços.","pratica":"Agradeça a alguém novo que chegou neste ano.","pergunta_diario":"Quem chegou na sua vida neste período?"},{"dia":353,"titulo":"Lembrete de apoio","mensagem":"Se em algum momento a dor ficar insuportável, ligue 188, o CVV, gratuito e 24 horas. Você não precisa atravessar isso sozinho.","pratica":"Confira se o número 188 está salvo no seu celular.","pergunta_diario":"Quem você chamaria num momento muito difícil?"},{"dia":357,"titulo":"O que você construiu","mensagem":"Olhe para o que você construiu neste ano: rituais, cartas, memórias guardadas, conversas, pequenos passos. Nada disso apaga a dor, mas mostra a sua força para seguir.","pratica":"Faça uma lista do que você construiu neste ano.","pergunta_diario":"Do que você se orgulha neste ano?"},{"dia":360,"titulo":"Um lugar especial","mensagem":"Pense num lugar que era especial para vocês. Quando se sentir pronto, uma visita pode ser uma forma de homenagem.","pratica":"Escreva sobre esse lugar especial.","pergunta_diario":"Que lugar era especial para vocês?"},{"dia":365,"titulo":"Um ano","mensagem":"Um ano. Você atravessou o primeiro ano inteiro com essa ausência: as primeiras datas, as estações, os dias bons e os muito difíceis. A saudade não termina aqui, e o amor também não. Seu diário, suas cartas e suas memórias continuam guardados neste app, para você voltar sempre que quiser. Obrigado por ter deixado o Saudade que Acolhe caminhar com você.","pratica":"Escreva uma carta para essa pessoa contando como foi este ano.","pergunta_diario":"O que você quer levar para o segundo ano?"}]},"apoio":{"titulo":"Quando apertar","respiracao":{"duracao_seg":60,"roteiro":["Sente-se ou deite-se de um jeito confortável.","Puxe o ar pelo nariz contando até 4.","Segure o ar contando até 2.","Solte o ar pela boca, bem devagar, contando até 6.","Repita mais algumas vezes até completar um minuto.","Se quiser, coloque a mão no peito e sinta o ar entrando e saindo."]},"frases":["Essa onda é forte, e ela vai passar.","Você não precisa resolver nada agora.","Sentir saudade é sinal de que houve muito amor.","Um minuto de cada vez já é suficiente.","Você pode chorar, se precisar.","Não existe jeito certo de sentir isso.","Você já atravessou outros momentos difíceis.","Você pode pedir companhia a alguém agora.","Seja gentil com você neste momento.","O amor que vocês viveram continua existindo."],"contatos":{"pessoa_de_confianca":"Ligar para alguém que você cadastrou no app","cvv":{"telefone":"188","descricao":"CVV – Centro de Valorização da Vida: apoio emocional gratuito, sigiloso, 24 horas, todos os dias. Também por chat em cvv.org.br."},"emergencia":"Em risco imediato, ligue 192 (SAMU) ou procure o pronto-socorro mais próximo."}},"avisos":{"aviso_fixo":"O Saudade que Acolhe é companhia e apoio para os dias de saudade. Ele não substitui acompanhamento médico ou psicológico. Se você precisar de ajuda agora, ligue 188 (CVV, gratuito, 24 horas)."},"caminhos":{"descricao":"Mensagem extra por tipo de perda, exibida nos dias-chave (1, 7, 30, 90, 180, 365) junto com a mensagem do dia.","tipos":{"pai_ou_mae":{"rotulo":"Pai ou mãe","mensagens":{"1":"Perder pai ou mãe é perder alguém que sempre esteve lá desde o começo da sua história. Mesmo adulto, é comum se sentir sem chão. Seja paciente com você.","7":"Muitas vezes a gente lembra de conselhos, broncas e jeitos de falar. Essas marcas continuam em você, nas suas escolhas e no seu jeito de cuidar.","30":"Datas como Dia das Mães ou Dia dos Pais podem pesar muito. Cadastre essas datas no app para receber uma mensagem preparada.","90":"Talvez você esteja cuidando de quem ficou, como o outro pai, a mãe, irmãos. Lembre que você também está de luto e merece cuidado.","180":"Pense em algo que seu pai ou sua mãe gostava de fazer e que você pode fazer em homenagem: uma receita, um passeio, uma música.","365":"Um ano sem essa presença. O que ele ou ela plantou em você continua crescendo."}},"conjuge":{"rotulo":"Marido, esposa ou companheiro(a)","mensagens":{"1":"Perder quem dividia a vida com você muda tudo: a casa, a rotina, os sonhos. É natural sentir que metade de você foi junto. Vá devagar.","7":"A cama, a mesa, o carro, o telefone. A ausência aparece em cada canto. Permita-se sentir sem pressa de mudar nada.","30":"Decisões grandes, como mudar de casa ou vender bens, costumam ser melhores quando não são tomadas no impulso dos primeiros meses. Se puder, espere e peça orientação.","90":"Talvez você esteja aprendendo tarefas que eram dele ou dela. Tudo bem pedir ajuda e aprender aos poucos.","180":"Aniversário de casamento e datas do casal podem pesar. Cadastre-as no app e pense em como quer viver esses dias.","365":"Um ano. A história de vocês continua sendo parte de quem você é, e você pode carregá-la para os próximos passos."}},"filho":{"rotulo":"Filho ou filha","mensagens":{"1":"Não existe dor que se compare à de perder um filho. Não há palavras que resolvam. Este espaço está aqui para acompanhar você, um dia de cada vez.","7":"Os sonhos que você tinha para seu filho ou filha também doem. Você pode escrever sobre eles aqui, quando quiser.","30":"Pais e mães costumam sentir o luto de formas diferentes. Isso não significa que um ama mais que o outro. Tente conversar com paciência.","90":"Se há outros filhos, eles também estão de luto e precisam de você, mesmo que de outro jeito. Peça apoio para dividir esse cuidado.","180":"Grupos de apoio de pais e mães que perderam filhos podem acolher de um jeito único. Se fizer sentido, procure um na sua cidade ou online.","365":"Um ano. O amor por seu filho ou sua filha não diminui com o tempo. Ele encontra novas formas de existir."}},"amigo":{"rotulo":"Amigo ou amiga","mensagens":{"1":"Às vezes o luto por um amigo não é tão reconhecido pelos outros. Mas a dor é real e merece espaço.","7":"Amigos guardam histórias que só vocês conhecem. Escreva algumas delas aqui para não se perderem.","30":"Conversar com outros amigos em comum pode ajudar. Vocês dividem a mesma saudade.","90":"Se fizer sentido, aproxime-se da família do seu amigo. Muitas vezes eles também gostam de ouvir histórias que não conheciam.","180":"Pense numa forma de homenagear essa amizade: um encontro com amigos, uma viagem que vocês iam fazer, uma tradição de vocês.","365":"Um ano. A amizade continua viva nas lembranças e no que vocês construíram juntos."}},"outro_familiar":{"rotulo":"Avô, avó, irmão, irmã ou outro familiar","mensagens":{"1":"Cada laço familiar é único. Avós, irmãos, tios, primos: perder alguém da família mexe com a história inteira de vocês.","7":"Talvez a família esteja se reorganizando. Cada um sente de um jeito. Respeite o seu jeito também.","30":"Encontros de família podem ter um lugar vazio. Um momento de lembrança juntos pode trazer conforto.","90":"Pergunte a outros familiares histórias que você não conhecia. A memória fica mais rica quando é dividida.","180":"Receitas, tradições e jeitos de falar passam de geração em geração. O que dessa pessoa você quer manter na família?","365":"Um ano. Essa pessoa continua fazendo parte da história da sua família."}}}},"datas":{"descricao":"Mensagens enviadas na véspera e no dia de cada data cadastrada pela pessoa.","datas":{"aniversario":{"rotulo":"Aniversário de quem partiu","vespera":"Amanhã seria o aniversário de quem você ama. É comum que a véspera pese. Se puder, decida hoje como quer viver o dia: com quem, onde, se quer algum gesto de lembrança.","dia":"Hoje é o aniversário de quem você ama. Você pode celebrar a vida dessa pessoa do jeito que fizer sentido: um bolo, uma música, uma visita, uma oração, ou simplesmente um dia quieto. Não existe jeito certo.","pratica":"Escreva uma carta de aniversário para essa pessoa."},"partida":{"rotulo":"Data da partida","vespera":"Amanhã é a data da partida. Muitas pessoas sentem a véspera ainda mais forte. Tente não ficar sozinho se não quiser, e combine algo simples com alguém de confiança.","dia":"Hoje faz mais um ciclo desde a partida. Seja muito gentil com você. Faça o que der e o que fizer sentido: um momento de lembrança, um descanso, uma companhia. O amor que vocês viveram continua.","pratica":"Acenda uma vela ou faça um gesto de lembrança."},"natal":{"rotulo":"Natal","vespera":"O Natal pode ser um dos dias mais difíceis sem quem você ama. Você não precisa fingir alegria. Pode reduzir a festa, mudar a tradição ou incluir um momento de lembrança.","dia":"Feliz Natal, do jeito que for possível hoje. Se quiser, reserve um lugar, uma foto ou uma oração para quem partiu. A saudade pode sentar à mesa junto com o amor.","pratica":"Inclua um momento de lembrança na ceia."},"ano_novo":{"rotulo":"Ano-Novo","vespera":"A virada do ano pode trazer a sensação de deixar a pessoa para trás. Não é isso. Você leva essa pessoa com você para o ano novo.","dia":"Um novo ano começa, e o amor por quem partiu vai junto. Escreva um desejo para o ano que você gostaria que essa pessoa ouvisse.","pratica":"Escreva um desejo para o novo ano."},"dia_das_maes":{"rotulo":"Dia das Mães","vespera":"O Dia das Mães se aproxima, e as propagandas e as festas podem pesar. Planeje o seu dia com antecedência e proteja-se do que for demais.","dia":"Hoje é um dia de muitas lembranças. Se você perdeu sua mãe, ou se é uma mãe que perdeu um filho, este dia pode doer muito. Faça o que for possível, com carinho por você.","pratica":"Escreva uma lembrança especial ligada a esta data."},"dia_dos_pais":{"rotulo":"Dia dos Pais","vespera":"O Dia dos Pais está chegando. Se este dia pesa para você, pense desde já em como quer passar por ele, com quem e onde.","dia":"Hoje é um dia de lembranças. Se você perdeu seu pai, ou se é um pai que perdeu um filho, permita-se sentir. Um gesto simples de homenagem pode trazer conforto.","pratica":"Faça algo que essa pessoa gostava em homenagem."},"casamento":{"rotulo":"Aniversário de casamento ou de namoro","vespera":"Amanhã é a data de vocês. Datas do casal costumam pesar muito. Escolha com carinho como quer viver esse dia.","dia":"Hoje é o dia de vocês. Relembre momentos, olhe fotos, escreva uma carta. A história de vocês continua sendo sua.","pratica":"Escreva uma carta para comemorar a história de vocês."},"personalizada":{"rotulo":"Outra data importante","vespera":"Amanhã é uma data importante para você. Prepare-se com gentileza: decida com quem estar e o que gostaria de fazer.","dia":"Hoje é uma data especial. Faça o que trouxer paz: um gesto, uma lembrança, um descanso.","pratica":"Registre como foi este dia no diário."}}},"guia":{"titulo":"Para quem quer ajudar","intro":"Este guia é para amigos e familiares que querem apoiar alguém que perdeu uma pessoa querida. Você pode enviar pelo WhatsApp.","o_que_ajuda":["Estar presente, mesmo em silêncio.","Falar o nome de quem partiu e lembrar histórias.","Oferecer ajuda concreta: levar uma comida, buscar as crianças, aco
